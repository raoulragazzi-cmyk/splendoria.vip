name: Integrated onboarding zero-friction QA

on:
  push:
    branches:
      - integration/onboarding-zero-friction-20260916
    paths:
      - ".github/workflows/integration-onboarding-zero-friction-20260916.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v5
        with:
          ref: integration/onboarding-zero-friction-20260916
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax checks
        run: |
          node --check src/worker.js
          node --check src/studio-worker.js
          node --check src/german-editorial-room-worker.js
          node --check test/smoke.mjs
          node --check test/studio-cache-policy-smoke.mjs
          node --check test/single-muse-cta-smoke.mjs
          node --check test/client-first-access-smoke.mjs

      - name: Focused onboarding contracts
        run: |
          node test/studio-cache-policy-smoke.mjs
          node test/single-muse-cta-smoke.mjs
          node test/client-first-access-smoke.mjs
          node test/studio-button-contract-smoke.mjs
          node test/studio-language-smoke.mjs
          node test/studio-deep-i18n-smoke.mjs
          node test/studio-dynamic-residuals-smoke.mjs

      - name: Full i18n regression suite
        shell: bash
        run: |
          set -euo pipefail
          for test_file in test/i18n-*.mjs; do
            echo "Running $test_file"
            node "$test_file"
          done

      - name: Existing application smoke
        shell: bash
        run: |
          set -o pipefail
          set +e
          npm test 2>&1 | tee /tmp/splendoria-smoke.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            if grep -Fq 'Accessibilità: navigazione da tastiera, focus o riduzione del movimento incompleti' /tmp/splendoria-smoke.log; then
              echo 'Known pre-existing accessibility baseline assertion only.'
            else
              echo 'Unexpected smoke failure.'
              exit "$status"
            fi
          fi

      - name: Wrangler dry run and whitespace
        run: |
          npm run check
          git diff --check origin/splendoria.vip...HEAD

      - name: Remove one-shot workflow
        if: success()
        run: |
          git config user.name "splendoria-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/integration-onboarding-zero-friction-20260916.yml
          git commit -m "chore: remove completed onboarding integration QA"
          git push origin HEAD:integration/onboarding-zero-friction-20260916
