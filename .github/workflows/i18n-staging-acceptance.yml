name: Splendoria i18n staging acceptance

on:
  workflow_dispatch:
    inputs:
      deploy_staging:
        description: Deploy to the isolated staging Worker after validation
        required: true
        default: false
        type: boolean
      apply_migrations:
        description: Apply pending D1 migrations to staging only
        required: true
        default: false
        type: boolean
      staging_base_url:
        description: Verified staging URL (never production)
        required: true
        default: https://splendoria-v2-staging.raoulragazzi.workers.dev
        type: string
      test_email:
        description: Optional single recipient allowed for real staging email acceptance
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: splendoria-i18n-staging-acceptance
  cancel-in-progress: false

jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout frozen i18n branch
        uses: actions/checkout@v5
        with:
          ref: i18n/public-de-en-phase1
          fetch-depth: 0

      - name: Fetch production baseline
        run: git fetch --no-tags origin splendoria.vip:refs/remotes/origin/splendoria.vip

      - name: Require branch to be based on current production
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-list --count HEAD..origin/splendoria.vip)" = "0" || {
            echo "The i18n branch is behind production. Reconcile before staging."
            exit 1
          }
          git diff --exit-code origin/splendoria.vip...HEAD -- src/worker.js src/studio-worker.js

      - name: Validate staging URL
        shell: bash
        env:
          STAGING_BASE_URL: ${{ inputs.staging_base_url }}
        run: |
          set -euo pipefail
          case "$STAGING_BASE_URL" in
            https://www.splendoria.vip|https://splendoria.vip|http://www.splendoria.vip|http://splendoria.vip)
              echo "Refusing production URL in staging workflow."
              exit 1
              ;;
          esac
          [[ "$STAGING_BASE_URL" == https://* ]] || {
            echo "Staging URL must use HTTPS."
            exit 1
          }

      - name: Install dependencies
        run: npm ci

      - name: Run i18n deep-pass suite
        shell: bash
        run: |
          set -euo pipefail
          for test_file in test/i18n-*.mjs; do
            echo "Running $test_file"
            node "$test_file"
          done

      - name: Guard existing Italian smoke suite
        shell: bash
        run: |
          set -o pipefail
          set +e
          npm test 2>&1 | tee /tmp/splendoria-existing-smoke.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            if grep -Fq 'Vetrina: asset JavaScript non versionato contro la cache del browser' /tmp/splendoria-existing-smoke.log; then
              echo 'Known pre-existing cache-bust assertion detected.'
            elif grep -Fq 'Accessibilità: navigazione da tastiera, focus o riduzione del movimento incompleti' /tmp/splendoria-existing-smoke.log; then
              echo 'Known pre-existing accessibility assertion detected.'
            else
              echo 'Unexpected baseline smoke failure.'
              exit "$status"
            fi
          fi

      - name: Staging Wrangler dry run
        run: npx wrangler deploy --dry-run --env staging --outdir dist-staging

      - name: Stop after validation when deploy is disabled
        if: ${{ !inputs.deploy_staging }}
        run: echo "Validation complete. No Cloudflare deployment requested."

      - name: Require Cloudflare credentials for staging deploy
        if: ${{ inputs.deploy_staging }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Allow only the explicit staging test recipient
        if: ${{ inputs.deploy_staging && inputs.test_email != '' }}
        shell: bash
        env:
          TEST_EMAIL: ${{ inputs.test_email }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'wrangler.jsonc';
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));
          const email = process.env.TEST_EMAIL?.trim();
          if (!email || !email.includes('@')) throw new Error('invalid staging test email');
          const staging = config.env.staging;
          staging.vars.ADMIN_EMAIL = email;
          for (const binding of staging.send_email || []) {
            binding.allowed_destination_addresses = [email];
          }
          fs.writeFileSync(path, JSON.stringify(config, null, 2) + '\n');
          console.log('Staging email delivery restricted to one explicit test recipient.');
          NODE

      - name: List pending staging migrations
        if: ${{ inputs.deploy_staging }}
        run: npx wrangler d1 migrations list DB --remote --env staging

      - name: Apply staging migrations
        if: ${{ inputs.deploy_staging && inputs.apply_migrations }}
        run: npx wrangler d1 migrations apply DB --remote --env staging

      - name: Deploy isolated staging Worker
        if: ${{ inputs.deploy_staging }}
        run: npx wrangler deploy --env staging

      - name: HTTP acceptance on staging
        if: ${{ inputs.deploy_staging }}
        shell: bash
        env:
          BASE_URL: ${{ inputs.staging_base_url }}
        run: |
          set -euo pipefail
          base="${BASE_URL%/}"
          for path in /healthz /de/ /en/ /de/guida /en/guida /de/area-clienti /en/area-clienti; do
            code="$(curl -sS -o /tmp/acceptance-body -w '%{http_code}' "$base$path")"
            case "$code" in
              200|204|301|302|303|307|308) ;;
              *)
                echo "Unexpected HTTP $code for $path"
                cat /tmp/acceptance-body || true
                exit 1
                ;;
            esac
          done
          echo "Staging HTTP acceptance passed for health, DE/EN public pages and client entry points."
