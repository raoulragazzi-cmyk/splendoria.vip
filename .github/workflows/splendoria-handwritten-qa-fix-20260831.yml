name: Splendoria handwritten QA fix 2026-08-31

on:
  push:
    branches:
      - splendoria.vip
    paths:
      - .github/workflows/splendoria-handwritten-qa-fix-20260831.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: splendoria.vip
          fetch-depth: 0

      - name: Make compiled-string matches literal
        shell: python
        run: |
          from pathlib import Path
          p = Path('.github/scripts/splendoria_handwritten_qa_fix_20260831.py')
          s = p.read_text(encoding='utf-8')
          for name in ['gen_prelude_old','gen_prelude_new','content_old','content_new']:
              s = s.replace(name + " = '''", name + " = r'''", 1)
          p.write_text(s, encoding='utf-8')

      - name: Apply only handwritten QA fixes
        run: python .github/scripts/splendoria_handwritten_qa_fix_20260831.py

      - name: Install dependencies
        run: npm ci

      - name: Syntax checks
        run: |
          node --check src/worker.js
          node --check src/studio-worker.js

      - name: Adapt only stale asset-version assertion in CI workspace
        shell: python
        run: |
          from pathlib import Path
          p = Path('test/smoke.mjs')
          s = p.read_text(encoding='utf-8')
          versions = ['20260831-1','20260829-1','20260817-2','20260812-3']
          found = next((v for v in versions if v in s), None)
          if found:
              s = s.replace(found, '20260831-2')
              p.write_text(s, encoding='utf-8')
              print('Adapted smoke asset key', found)
          else:
              print('No stale asset key in smoke test; nothing to adapt')

      - name: Smoke tests
        run: npm test

      - name: Wrangler dry run
        run: npm run check

      - name: Static safety assertions
        shell: python
        run: |
          from pathlib import Path
          w = Path('src/worker.js').read_text(encoding='utf-8')
          s = Path('src/studio-worker.js').read_text(encoding='utf-8')
          required = [
            ('50-word chapter rule', 'sourceWords < 50' in w),
            ('no reimagine label', "Reimmagina l'indice" not in w),
            ('server outline protection', 'L’indice esistente è protetto' in w),
            ('restore route', 'restoreLastBookVersion' in w),
            ('backup storage', 'BookProjectBackup' in w),
            ('exact section storage', 'BookChapterSection' in w),
            ('Musa does not reuse prior chapter prose', 'museContext(project, [], [interview?.answers, submittedContent]' in w),
            ('cookie hidden override', '.cookie-banner.privacy-first[hidden]{display:none!important}' in s),
            ('clear section count', 'parole scritte · Musa: circa' in s),
            ('section boundary persistence', "area.name = 'section' + index" in s),
            ('chapter separator', '.chapter-list>.chapter-card:not(:first-child)::before' in s),
            ('Qwen retained', '@cf/qwen/qwen3.8-27b' in w),
          ]
          print(dict(required))
          failed = [name for name, ok in required if not ok]
          if failed: raise SystemExit('Safety assertions failed: ' + ', '.join(failed))

      - name: Commit application sources only
        shell: bash
        run: |
          set -euo pipefail
          git restore test/smoke.mjs || true
          git restore .github/scripts/splendoria_handwritten_qa_fix_20260831.py || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/worker.js src/studio-worker.js
          git diff --cached --check
          git diff --cached --stat
          git commit -m "fix: protect Splendoria writing and section state"
          git push origin HEAD:splendoria.vip
