name: Musa D1 staging migration gate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: splendoria-musa-d1-staging
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Validate exact isolated staging target
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const conf=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          const db=conf.env?.staging?.d1_databases?.find(x=>x.binding==='DB');
          if(conf.env?.staging?.name!=='splendoria-v2-staging' ||
             db?.database_name!=='splendoria-v2-test' ||
             db?.database_id!=='8bf872f6-3f9e-471f-95bc-a99a94f0d97c')
             throw Error('Staging target mismatch');
          NODE
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
      - name: Verify Node and SQLite integration tests
        run: |
          node test/musa-interview-policy.mjs
          node test/musa-interview-auth.mjs
          node test/musa-interview-store.mjs
          node test/musa-interview-api.mjs
          node test/musa-interview-ai.mjs
          node test/musa-interview-consent.mjs
          node test/musa-interview-next.mjs
          node test/musa-interview-state.mjs
          node test/musa-interview-atomic.mjs
          node test/musa-interview-controls.mjs
          node test/musa-interview-recovery.mjs
          node test/musa-interview-quota.mjs
          python3 test/musa-sqlite-integration.py
          python3 test/musa-quota-sqlite.py
      - name: Show pending staging migrations
        run: npx wrangler d1 migrations list DB --env staging --remote
      - name: Apply migrations to staging only
        run: npx wrangler d1 migrations apply DB --env staging --remote
      - name: Confirm expected staging tables
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute DB --env staging --remote --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('MuseInterviewSession','MuseInterviewTurn','MuseInterviewConsent','MuseRequestQuota') ORDER BY name"
          npx wrangler d1 execute DB --env staging --remote --command "SELECT name FROM pragma_table_info('MuseInterviewSession') WHERE name='lastWriteToken'"
      - name: Do not deploy application
        run: echo "Migration gate only. No Worker deploy, no production changes."
