name: TEMP validate production workflow hardening 2026-09-18

on:
  push:
    branches: ["infra/production-workflow-hardening-20260918"]
    paths:
      - ".github/workflows/temp-production-workflow-hardening-check-20260918.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Validate workflow hardening contract
        shell: bash
        run: |
          set -euo pipefail
          file=.github/workflows/i18n-production-release.yml
          grep -Fq 'environment: production' "$file"
          grep -Fq 'npm audit --audit-level=high' "$file"
          grep -Fq 'npx wrangler deploy --dry-run --env=""' "$file"
          grep -Fq 'npx wrangler deploy --env=""' "$file"
          grep -Fq '/workers/scripts/splendoria-v2/settings' "$file"
          grep -Fq '/email/routing/rules/plan' "$file"
          grep -Fq '1a46b8b0-2e6f-44cf-a22f-4950259f9434' "$file"
          ! grep -Eq 'd1 migrations apply|migrations apply' "$file"
      - name: Security audit
        run: npm audit --audit-level=high
      - name: Regression checks
        shell: bash
        run: |
          set -euo pipefail
          node test/i18n-visible-residuals-smoke.mjs
          node test/studio-deep-i18n-smoke.mjs
          node test/studio-dynamic-residuals-smoke.mjs
          node test/studio-dictation-de-ux.test.mjs
          node test/de-release-runtime.test.mjs
          npx wrangler deploy --dry-run --env=""
