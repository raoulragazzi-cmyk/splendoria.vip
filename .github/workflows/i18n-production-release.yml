name: Splendoria i18n production release

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact splendoria.vip commit SHA approved for production
        required: true
        type: string
      deploy_production:
        description: Actually deploy after all release gates pass
        required: true
        default: false
        type: boolean
      confirmation:
        description: Type DEPLOY SPLENDORIA I18N to authorize production deploy
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: splendoria-production-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v5
        with:
          ref: splendoria.vip
          fetch-depth: 0

      - name: Freeze exact candidate SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SHA" || {
            echo "Production branch moved: expected $EXPECTED_SHA, found $actual."
            exit 1
          }
          echo "candidate_sha=$actual" >> "$GITHUB_ENV"

      - name: Verify multilingual release entry point
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '"main": "src/german-editorial-room-worker.js"' wrangler.jsonc
          grep -Fq '"name": "splendoria-v2"' wrangler.jsonc
          grep -Fq '"database_name": "splendoria-db"' wrangler.jsonc
          test -f src/i18n-worker.js
          test -f src/i18n-email-worker.js
          test -f src/german-editorial-room-worker.js
          test -f test/i18n-visible-residuals-smoke.mjs
          test -f test/i18n-layout-safety-smoke.mjs
          test -f test/studio-dictation-de-ux.test.mjs
          test -f test/de-release-runtime.test.mjs
          ! grep -Fq '"/admin"' src/i18n-client-worker.js
          ! grep -Fq '"/area-amministratore"' src/i18n-client-worker.js

      - name: Install dependencies
        run: npm ci

      - name: Dependency security gate
        shell: bash
        run: |
          set -euo pipefail
          npm audit --audit-level=high

      - name: Run full multilingual release suite
        shell: bash
        run: |
          set -euo pipefail
          node --check src/worker.js
          node --check src/studio-worker.js
          node --check src/german-editorial-room-worker.js
          for test_file in test/i18n-*.mjs; do
            echo "Running $test_file"
            node "$test_file"
          done
          node test/studio-dictation-de-ux.test.mjs
          node test/de-release-runtime.test.mjs

      - name: Guard existing Italian smoke suite
        shell: bash
        run: |
          set -o pipefail
          set +e
          npm test 2>&1 | tee /tmp/splendoria-existing-smoke.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            if grep -Fq 'Vetrina: asset JavaScript non versionato contro la cache del browser' /tmp/splendoria-existing-smoke.log; then
              echo 'Known pre-existing cache-bust assertion detected.'
            elif grep -Fq 'Accessibilità: navigazione da tastiera, focus o riduzione del movimento incompleti' /tmp/splendoria-existing-smoke.log; then
              echo 'Known pre-existing accessibility assertion detected.'
            else
              echo 'Unexpected baseline smoke failure.'
              exit "$status"
            fi
          fi

      - name: Production Wrangler dry run
        run: npx wrangler deploy --dry-run --env=""

      - name: Stop safely when deploy is disabled
        if: ${{ !inputs.deploy_production }}
        run: echo "Release candidate validated at $candidate_sha. No production deployment requested."

      - name: Require explicit production authorization
        if: ${{ inputs.deploy_production }}
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = "DEPLOY SPLENDORIA I18N" || {
            echo "Production confirmation phrase does not match."
            exit 1
          }
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Preflight Cloudflare production permissions and bindings
        if: ${{ inputs.deploy_production }}
        shell: bash
        env:
          EXPECTED_PROD_DB_ID: 1a46b8b0-2e6f-44cf-a22f-4950259f9434
        run: |
          set -euo pipefail

          curl -fsS             -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"             "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/splendoria-v2/settings"             -o /tmp/splendoria-worker-settings.json

          jq -e '.success == true' /tmp/splendoria-worker-settings.json >/dev/null
          actual_db_id="$(jq -r '.result.bindings[] | select(.name=="DB" and .type=="d1") | (.id // .namespace_id // empty)' /tmp/splendoria-worker-settings.json | head -n1)"
          test "$actual_db_id" = "$EXPECTED_PROD_DB_ID" || {
            echo "Refusing deploy: production Worker DB binding is not the expected production D1 database."
            exit 1
          }

          curl -fsS             -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"             "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/email/routing/rules/plan"             -o /tmp/splendoria-email-routing-plan.json

          jq -e '.success == true' /tmp/splendoria-email-routing-plan.json >/dev/null
          echo "Cloudflare production preflight passed: Worker access, production D1 binding and Email Routing read are available."

      - name: Deploy exact candidate to Cloudflare Workers
        if: ${{ inputs.deploy_production }}
        run: npx wrangler deploy --env=""

      - name: Immediate production smoke test
        if: ${{ inputs.deploy_production }}
        shell: bash
        run: |
          set -euo pipefail
          base="https://www.splendoria.vip"
          for path in /healthz / /de/ /en/ /de/guida /en/guida /area-clienti /de/area-clienti /en/area-clienti /de/registrati /en/registrati; do
            code="$(curl -sS -o /tmp/production-smoke-body -w '%{http_code}' "$base$path")"
            case "$code" in
              200|204|301|302|303|307|308) ;;
              *)
                echo "Production smoke failed: HTTP $code for $path"
                cat /tmp/production-smoke-body || true
                echo "Do not continue. Use the guarded rollback workflow with the recorded last-known-good SHA."
                exit 1
                ;;
            esac
          done

          de_area="$(curl -fsS "$base/de/area-clienti")"
          printf '%s' "$de_area" | grep -Fq '<title>Kundenbereich — Splendoria</title>'
          ! printf '%s' "$de_area" | grep -Fq 'Splendoria trasforma la tua storia in un libro'

          curl -fsS             -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"             "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/splendoria-v2/settings"             -o /tmp/splendoria-worker-settings-postdeploy.json
          jq -e '.success == true' /tmp/splendoria-worker-settings-postdeploy.json >/dev/null
          postdeploy_db_id="$(jq -r '.result.bindings[] | select(.name=="DB" and .type=="d1") | (.id // .namespace_id // empty)' /tmp/splendoria-worker-settings-postdeploy.json | head -n1)"
          test "$postdeploy_db_id" = "1a46b8b0-2e6f-44cf-a22f-4950259f9434" || {
            echo "Production smoke failed: Worker DB binding changed unexpectedly."
            exit 1
          }

          echo "Production smoke passed for health, IT/DE/EN routes, client entry points, DE metadata and production D1 binding."
