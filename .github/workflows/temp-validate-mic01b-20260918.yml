name: TEMP validate MIC-01B 2026-09-18

on:
  push:
    branches: ["ux/de-dictation-background-errors-20260918"]
    paths:
      - ".github/workflows/temp-validate-mic01b-20260918.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: node --test test/studio-dictation-de-ux.test.mjs
      - run: node test/i18n-ui-runtime-smoke.mjs
      - run: node test/de-release-runtime.test.mjs
      - run: npm audit --audit-level=high
      - run: npx wrangler deploy --dry-run --env=""
