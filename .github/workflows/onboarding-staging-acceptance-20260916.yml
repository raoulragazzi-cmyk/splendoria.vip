name: Onboarding zero-friction staging acceptance

on:
  push:
    branches:
      - integration/onboarding-zero-friction-20260916
    paths:
      - ".github/workflows/onboarding-staging-acceptance-20260916.yml"

permissions:
  contents: write

concurrency:
  group: splendoria-onboarding-staging-20260916
  cancel-in-progress: false

jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STAGING_BASE_URL: https://splendoria-v2-staging.raoulragazzi.workers.dev
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v5
        with:
          ref: integration/onboarding-zero-friction-20260916
          fetch-depth: 0

      - name: Refuse production targets
        shell: bash
        run: |
          set -euo pipefail
          case "$STAGING_BASE_URL" in
            https://www.splendoria.vip|https://splendoria.vip|http://www.splendoria.vip|http://splendoria.vip)
              echo "Refusing production URL."
              exit 1
              ;;
          esac
          grep -Fq '"name": "splendoria-v2-staging"' wrangler.jsonc
          grep -Fq '"database_name": "splendoria-v2-test"' wrangler.jsonc

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Final regression gate
        shell: bash
        run: |
          set -euo pipefail
          node test/progressive-book-setup-smoke.mjs
          node test/client-first-access-smoke.mjs
          node test/single-muse-cta-smoke.mjs
          node test/studio-cache-policy-smoke.mjs
          for test_file in test/i18n-*.mjs; do node "$test_file"; done
          npx wrangler deploy --dry-run --env staging --outdir dist-staging
          git diff --check origin/splendoria.vip...HEAD

      - name: Normalize and require staging credentials
        shell: bash
        run: |
          set -euo pipefail
          raw="${CLOUDFLARE_API_TOKEN:-}"
          test -n "$raw" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          clean="$(printf '%s' "$raw" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/^[Bb][Ee][Aa][Rr][Ee][Rr][[:space:]]\+//')"
          test -n "$clean" || { echo "Cloudflare API token is empty after normalization"; exit 1; }
          printf 'CLOUDFLARE_API_TOKEN=%s\n' "$clean" >> "$GITHUB_ENV"

      - name: Deploy isolated staging only
        run: npx wrangler deploy --env staging

      - name: HTTP acceptance
        shell: bash
        run: |
          set -euo pipefail
          base="${STAGING_BASE_URL%/}"
          check_code() {
            path="$1"; expected="$2"
            code="$(curl -sS -o /tmp/spl-body -w '%{http_code}' "$base$path")"
            if [ "$code" != "$expected" ]; then
              echo "Unexpected HTTP $code for $path; expected $expected"
              head -c 1200 /tmp/spl-body || true
              exit 1
            fi
          }
          check_code /healthz 200
          check_code / 200
          check_code /registrati 200
          check_code /area-clienti 200
          check_code /area-amministratore 200
          check_code /accedi 303
          check_code /de/ 200
          check_code /en/ 200
          check_code /de/area-clienti 200
          check_code /en/area-clienti 200
          location="$(curl -sSI "$base/accedi" | tr -d '\r' | awk -F': ' 'tolower($1)=="location" {print $2}')"
          test "$location" = "/area-clienti" || { echo "Unexpected /accedi Location: $location"; exit 1; }
          echo "Isolated staging HTTP acceptance passed."

      - name: Remove one-shot workflow
        if: success()
        run: |
          git config user.name "splendoria-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/onboarding-staging-acceptance-20260916.yml
          git commit -m "chore: remove completed onboarding staging gate"
          git push origin HEAD:integration/onboarding-zero-friction-20260916
