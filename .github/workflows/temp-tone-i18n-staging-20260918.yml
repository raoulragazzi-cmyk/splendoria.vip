name: TEMP tone i18n staging 2026-09-18

on:
  push:
    branches: ["fix/de-tone-options-20260918"]
    paths:
      - ".github/workflows/temp-tone-i18n-staging-20260918.yml"

permissions:
  contents: read

jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STAGING_BASE_URL: https://splendoria-v2-staging.raoulragazzi.workers.dev
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      - name: Validate exact tone contract
        shell: bash
        run: |
          set -euo pipefail
          node test/i18n-editor-smoke.mjs
          node test/i18n-visible-residuals-smoke.mjs
          npm audit --audit-level=high

      - name: Guard isolated staging
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '"name": "splendoria-v2-staging"' wrangler.jsonc
          grep -Fq '"database_name": "splendoria-v2-test"' wrangler.jsonc
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"

      - name: Staging dry run
        run: npx wrangler deploy --dry-run --env staging

      - name: Deploy staging Worker
        shell: bash
        run: |
          set +e
          npx wrangler deploy --env staging 2>&1 | tee /tmp/staging-deploy.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            grep -Fq 'Uploaded splendoria-v2-staging' /tmp/staging-deploy.log
            grep -Fq 'Deployed splendoria-v2-staging triggers' /tmp/staging-deploy.log
            echo "Wrangler returned non-zero only after staging was published; continuing to independent read-back."
          fi

      - name: Staging read-back
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            code="$(curl -sS -o /tmp/health -w '%{http_code}' "$STAGING_BASE_URL/healthz" || true)"
            if [ "$code" = "200" ] && grep -Fq '"status":"ok"' /tmp/health; then break; fi
            sleep $((attempt * 2))
          done
          grep -Fq '"status":"ok"' /tmp/health
          echo "Staging tone candidate published and healthy."
