name: TEMP read-only production worker snapshot 2026-09-18

on:
  push:
    branches: ["ai/de-muse-dual-model-20260917"]
    paths:
      - ".github/workflows/temp-read-prod-worker-20260918.yml"

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - name: Guard read-only snapshot
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
      - name: Download current production Worker content
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p worker-snapshot
          curl -fsS             -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"             "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/splendoria-v2/content/v2"             -o worker-snapshot/splendoria-v2.multipart
          test -s worker-snapshot/splendoria-v2.multipart
          wc -c worker-snapshot/splendoria-v2.multipart
      - name: Upload snapshot
        uses: actions/upload-artifact@v4
        with:
          name: splendoria-v2-production-snapshot
          path: worker-snapshot/splendoria-v2.multipart
          retention-days: 2
