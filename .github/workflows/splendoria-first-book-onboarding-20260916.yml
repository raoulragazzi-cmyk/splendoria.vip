name: Splendoria first-book progressive onboarding

on:
  push:
    branches:
      - ux/first-book-progressive-onboarding-20260916
    paths:
      - ".github/workflows/splendoria-first-book-onboarding-20260916.yml"

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ux/first-book-progressive-onboarding-20260916
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Apply guarded progressive-disclosure patch
        run: python .github/scripts/first_book_onboarding_20260916.py
      - name: Add focused runtime contract
        shell: bash
        run: |
          cat > test/first-book-onboarding-smoke.mjs <<'EOF'
          import worker from "../src/studio-language-worker.js";
          const USER = { id: "user-1", email: "anna@example.com", nome: "Anna", passwordHash: "hash", createdAt: "2026-01-01T10:00:00.000Z", emailVerifiedAt: "2026-01-02T10:00:00.000Z" };
          const DB = {
            prepare(sql = "") { return {
              bind() { return this; },
              async run() { return { success: true, meta: { changes: 1 } }; },
              async first() {
                if (sql === "SELECT 1 AS ok") return { ok: 1 };
                if (sql.includes('FROM "Session" s JOIN "User"')) return { ...USER };
                if (sql.includes('SELECT COUNT(*) total FROM "BookProject"')) return { total: 0 };
                return null;
              },
              async all() {
                if (sql.includes('FROM "BookProject" p LEFT JOIN "BookChapter"')) return { results: [] };
                if (sql.includes('SELECT c.projectId,c.content')) return { results: [] };
                return { results: [] };
              }
            }; },
            async batch(statements) { return statements.map(() => ({ success: true, meta: { changes: 1 } })); }
          };
          const env = { DB, APP_URL: "https://www.splendoria.vip", ADMIN_EMAIL: "admin@example.invalid", EMAIL_FROM: "contatti@splendoria.vip", AI: { async run() { return { response: "ok" }; } } };
          const response = await worker.fetch(new Request("https://www.splendoria.vip/studio", { headers: { cookie: "spl_session=test-session" } }), env);
          if (response.status !== 200) throw new Error(`first-book studio status ${response.status}`);
          const html = await response.text();
          for (const marker of ['data-first-book', 'value="La mia storia"', '<summary>Personalizza genere e struttura</summary>', 'name="genre"', 'name="targetPages"', 'value="84" selected', 'data-book-language-panel', 'Inizia il mio libro']) if (!html.includes(marker)) throw new Error(`first-book onboarding missing ${marker}`);
          if (html.includes('data-first-book-language-slot')) throw new Error('first-book language placeholder was not replaced');
          if ((html.match(/La tua storia comincia qui/g) || []).length !== 1) throw new Error('first-book empty state is duplicated');
          const summaryIndex = html.indexOf('<summary>Personalizza genere e struttura</summary>');
          const genreIndex = html.indexOf('name="genre"');
          const languageIndex = html.indexOf('data-book-language-panel');
          const detailsEnd = html.indexOf('</details>', summaryIndex);
          if (!(summaryIndex >= 0 && genreIndex > summaryIndex && languageIndex > summaryIndex && detailsEnd > languageIndex)) throw new Error('advanced first-book controls are not contained in progressive disclosure');
          console.log('first-book onboarding: one-click default path with optional advanced settings preserved');
          EOF
      - name: Validate focused and multilingual contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check src/worker.js
          node --check src/studio-language-worker.js
          node --check src/i18n-client-worker.js
          node --check test/first-book-onboarding-smoke.mjs
          node test/first-book-onboarding-smoke.mjs
          node test/i18n-client-smoke.mjs
          node test/studio-language-smoke.mjs
          node test/studio-deep-i18n-smoke.mjs
          node test/studio-dynamic-residuals-smoke.mjs
          node test/i18n-visible-residuals-smoke.mjs
          for test_file in test/i18n-*.mjs; do node "$test_file"; done
          set +e
          npm test 2>&1 | tee /tmp/smoke.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            if grep -Fq 'Accessibilità: navigazione da tastiera, focus o riduzione del movimento incompleti' /tmp/smoke.log; then
              echo 'Known baseline accessibility assertion only.'
            else
              exit "$status"
            fi
          fi
          npm run check
          git diff --check
      - name: Commit application changes
        run: |
          git config user.name "splendoria-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/worker.js src/studio-language-worker.js src/i18n-client-worker.js src/styles.js test/i18n-client-smoke.mjs test/first-book-onboarding-smoke.mjs
          git commit -m "ux: simplify first-book onboarding with progressive disclosure"
          git push origin HEAD:ux/first-book-progressive-onboarding-20260916
      - name: Remove one-shot tooling
        run: |
          git rm .github/workflows/splendoria-first-book-onboarding-20260916.yml .github/scripts/first_book_onboarding_20260916.py
          git commit -m "chore: remove completed first-book onboarding tooling"
          git push origin HEAD:ux/first-book-progressive-onboarding-20260916
