name: TEMP DE Muse staging acceptance 2026-09-18

on:
  push:
    branches: ["ai/de-muse-dual-model-20260917"]
    paths:
      - ".github/workflows/temp-de-muse-staging-20260918.yml"

permissions:
  contents: read

concurrency:
  group: splendoria-de-muse-staging-20260918
  cancel-in-progress: false

jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STAGING_BASE_URL: https://splendoria-v2-staging.raoulragazzi.workers.dev
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Guard isolated staging only
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          grep -Fq '"main": "src/german-editorial-room-worker.js"' wrangler.jsonc
          grep -Fq '"name": "splendoria-v2-staging"' wrangler.jsonc
          grep -Fq '"database_name": "splendoria-v2-test"' wrangler.jsonc
          ! grep -Eq 'd1 migrations apply|migrations apply' .github/workflows/temp-de-muse-staging-20260918.yml
          case "$STAGING_BASE_URL" in
            https://www.splendoria.vip|https://splendoria.vip|http://www.splendoria.vip|http://splendoria.vip) exit 1 ;;
          esac
      - name: Candidate regression checks
        run: |
          node test/german-editorial-room-smoke.mjs
          node test/studio-dynamic-residuals-smoke.mjs
          npm run check:staging
      - name: Deploy staging Worker only
        id: deploy
        shell: bash
        run: |
          set +e
          npx wrangler deploy --env staging 2>&1 | tee /tmp/staging-deploy.log
          status=${PIPESTATUS[0]}
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "Wrangler exit status: $status"
      - name: Verify deployed candidate from HTTP
        shell: bash
        run: |
          set -euo pipefail
          base="${STAGING_BASE_URL%/}"
          for attempt in 1 2 3 4 5 6; do
            code="$(curl -sS -o /tmp/health -w '%{http_code}' "$base/healthz" || true)"
            if [ "$code" = "200" ] && grep -Fq '"status":"ok"' /tmp/health; then break; fi
            sleep $((attempt * 2))
          done
          grep -Fq '"status":"ok"' /tmp/health

          curl -fsS "$base/assets/studio.js?lang=de" -o /tmp/studio-de.js
          curl -fsS "$base/assets/studio.js?lang=en" -o /tmp/studio-en.js

          grep -Fq 'Weitere Überarbeitungen' /tmp/studio-de.js
          grep -Fq 'Automatisches Speichern aktiv' /tmp/studio-de.js
          grep -Fq 'Vorheriges Kapitel' /tmp/studio-de.js
          grep -Fq 'Letztes Kapitel' /tmp/studio-de.js
          grep -Fq 'Speichern und zum nächsten Kapitel' /tmp/studio-de.js
          grep -Fq 'Die Muse liest deinen Text noch einmal' /tmp/studio-de.js
          grep -Fq 'Die beiden Passwörter stimmen nicht überein.' /tmp/studio-de.js

          for marker in             'Altri interventi editoriali'             'Salvataggio automatico attivo'             'Capitolo precedente'             'Ultimo capitolo'             'La Musa sta rileggendo'             'Le due password non coincidono.'; do
            ! grep -Fq "$marker" /tmp/studio-de.js
          done

          grep -Fq 'More editorial options' /tmp/studio-en.js
          grep -Fq 'Automatic saving is on' /tmp/studio-en.js
          grep -Fq 'Previous chapter' /tmp/studio-en.js
          grep -Fq 'Last chapter' /tmp/studio-en.js

          for path in / /de/ /en/ /de/area-clienti /en/area-clienti; do
            code="$(curl -sS -o /tmp/body -w '%{http_code}' "$base$path")"
            test "$code" = "200"
          done
          echo "Staging candidate verified from served assets."
