name: DE Muse live quality benchmark

on:
  push:
    branches: ["ai/de-muse-dual-model-20260917"]
    paths:
      - "test/de-muse-live-quality-benchmark.mjs"
      - ".github/workflows/de-muse-live-quality-benchmark.yml"

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  benchmark:
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Guard credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "Missing staging token"; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "Missing account id"; exit 1; }
      - name: Run synthetic live benchmark only
        run: node test/de-muse-live-quality-benchmark.mjs
      - name: Upload benchmark outputs
        uses: actions/upload-artifact@v4
        with:
          name: de-muse-live-quality
          path: |
            artifacts/de-muse-live-quality.json
            artifacts/de-muse-live-quality.md
          retention-days: 7
