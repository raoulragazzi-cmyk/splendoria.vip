name: Finish Napoleon agent book

on:
  push:
    branches: ["splendoria.vip"]
    paths: [".github/workflows/finish-napoleon.yml"]

permissions:
  contents: read

jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: splendoria.vip

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Cloudflare credentials are present
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN repository secret"; exit 20; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID repository secret"; exit 21; }

      - name: Validate worker
        run: npm run check

      - name: Temporarily accelerate cron to every minute
        shell: python
        run: |
          from pathlib import Path
          p = Path('wrangler.jsonc')
          s = p.read_text(encoding='utf-8')
          old = '"crons": ["*/5 * * * *"]'
          new = '"crons": ["* * * * *"]'
          if old not in s:
              raise SystemExit('Expected five-minute cron not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

      - name: Deploy repaired worker with accelerated cron
        run: npx wrangler deploy

      - name: Inspect Napoleon before resume
        shell: bash
        run: |
          npx wrangler d1 execute splendoria-db --remote --json --command 'SELECT p.id,p.status,p.updatedAt,a.statoCommerciale,(SELECT COUNT(*) FROM "BookChapter" c WHERE c.projectId=p.id) AS totalChapters,(SELECT COUNT(*) FROM "BookChapter" c WHERE c.projectId=p.id AND c.status="generato_agente") AS generatedChapters FROM "BookProject" p LEFT JOIN "BookProjectAdmin" a ON a.projectId=p.id WHERE p.title="Io, Napoleone" ORDER BY p.createdAt LIMIT 1;'
          npx wrangler d1 execute splendoria-db --remote --json --command 'SELECT c.position,c.title,c.status,length(c.content) AS chars FROM "BookChapter" c JOIN "BookProject" p ON p.id=c.projectId WHERE p.title="Io, Napoleone" ORDER BY c.position;'

      - name: Resume exactly one blocked Napoleon chapter
        shell: bash
        run: |
          npx wrangler d1 execute splendoria-db --remote --command 'UPDATE "BookChapter" SET status="agente_da_generare",updatedAt=strftime("%Y-%m-%dT%H:%M:%fZ","now") WHERE id=(SELECT c.id FROM "BookChapter" c JOIN "BookProject" p ON p.id=c.projectId JOIN "BookProjectAdmin" a ON a.projectId=p.id WHERE p.title="Io, Napoleone" AND a.statoCommerciale="agente" AND c.status LIKE "agente_errore_%" ORDER BY c.position LIMIT 1); UPDATE "BookProject" SET status="agente_in_corso",updatedAt=strftime("%Y-%m-%dT%H:%M:%fZ","now") WHERE title="Io, Napoleone" AND (status="agente_in_pausa" OR (status="agente_in_esecuzione" AND datetime(updatedAt)<datetime("now","-20 minutes")));'

      - name: Wait until all twelve chapters are complete
        id: monitor
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 24); do
            echo "--- Napoleon check $i/24 ---"
            npx wrangler d1 execute splendoria-db --remote --json --command 'SELECT p.status AS project_status,p.updatedAt,(SELECT COUNT(*) FROM "BookChapter" c WHERE c.projectId=p.id) AS total_chapters,(SELECT COUNT(*) FROM "BookChapter" c WHERE c.projectId=p.id AND c.status="generato_agente") AS generated_chapters,(SELECT GROUP_CONCAT(c.position || ":" || c.status,"|") FROM "BookChapter" c WHERE c.projectId=p.id ORDER BY c.position) AS chapter_states FROM "BookProject" p WHERE p.title="Io, Napoleone" ORDER BY p.createdAt LIMIT 1;' > napoleon-status.json
            cat napoleon-status.json
            node <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('napoleon-status.json','utf8'));
          const rows = Array.isArray(data) ? data.flatMap(x => x.results || x.result || []) : (data.results || data.result || []);
          if (!rows.length) process.exit(3);
          const r = rows[0];
          console.log(`STATUS=${r.project_status} GENERATED=${r.generated_chapters}/${r.total_chapters}`);
          if (r.project_status === 'agente_completato') process.exit(0);
          if (r.project_status === 'agente_in_pausa') process.exit(2);
          process.exit(10);
          NODE
            code=$?
            if [ "$code" -eq 0 ]; then
              echo "Napoleon completed."
              exit 0
            fi
            if [ "$code" -eq 2 ]; then
              echo "Napoleon paused again after three quality failures."
              exit 2
            fi
            if [ "$code" -eq 3 ]; then
              echo "Napoleon project not found."
              exit 3
            fi
            sleep 60
          done
          echo "Timed out waiting for completion."
          exit 4

      - name: Final Napoleon status
        if: always()
        shell: bash
        run: |
          npx wrangler d1 execute splendoria-db --remote --json --command 'SELECT p.id,p.status,p.updatedAt,a.statoEditoriale,a.statoCommerciale FROM "BookProject" p LEFT JOIN "BookProjectAdmin" a ON a.projectId=p.id WHERE p.title="Io, Napoleone" ORDER BY p.createdAt LIMIT 1;' || true
          npx wrangler d1 execute splendoria-db --remote --json --command 'SELECT c.position,c.title,c.status,length(c.content) AS chars FROM "BookChapter" c JOIN "BookProject" p ON p.id=c.projectId WHERE p.title="Io, Napoleone" ORDER BY c.position;' || true

      - name: Restore normal five-minute cron and deploy
        if: always()
        shell: bash
        run: |
          git checkout -- wrangler.jsonc
          npx wrangler deploy || true
