name: Finish Napoleon agent book

on:
  push:
    branches: ["splendoria.vip"]
    paths: [".github/workflows/finish-napoleon.yml"]

concurrency:
  group: finish-napoleon-agent-book
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: splendoria.vip
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Cloudflare credentials are present
        id: auth
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN repository secret"; exit 20; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID repository secret"; exit 21; }

      - name: Validate worker
        id: validate
        run: npm run check

      - name: Temporarily accelerate cron to every minute
        id: accelerate
        shell: python
        run: |
          from pathlib import Path
          p = Path('wrangler.jsonc')
          s = p.read_text(encoding='utf-8')
          old = '"crons": ["*/5 * * * *"]'
          new = '"crons": ["* * * * *"]'
          if old not in s:
              raise SystemExit('Expected five-minute cron not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

      - name: Deploy repaired worker with accelerated cron
        id: deploy_fast
        run: npx wrangler deploy

      - name: Inspect Napoleon before resume
        id: inspect_before
        shell: bash
        run: |
          npx wrangler d1 execute splendoria-db --remote --json --command 'SELECT p.status,p.updatedAt,a.statoCommerciale,(SELECT COUNT(*) FROM "BookChapter" c WHERE c.projectId=p.id) AS totalChapters,(SELECT COUNT(*) FROM "BookChapter" c WHERE c.projectId=p.id AND c.status="generato_agente") AS generatedChapters FROM "BookProject" p LEFT JOIN "BookProjectAdmin" a ON a.projectId=p.id WHERE p.title="Io, Napoleone" ORDER BY p.createdAt LIMIT 1;' > napoleon-before-project.json
          npx wrangler d1 execute splendoria-db --remote --json --command 'SELECT c.position,c.title,c.status,length(c.content) AS chars FROM "BookChapter" c JOIN "BookProject" p ON p.id=c.projectId WHERE p.title="Io, Napoleone" ORDER BY c.position;' > napoleon-before-chapters.json
          cat napoleon-before-project.json
          cat napoleon-before-chapters.json

      - name: Resume exactly one blocked Napoleon chapter
        id: resume
        shell: bash
        run: |
          npx wrangler d1 execute splendoria-db --remote --command 'UPDATE "BookChapter" SET status="agente_da_generare",updatedAt=strftime("%Y-%m-%dT%H:%M:%fZ","now") WHERE id=(SELECT c.id FROM "BookChapter" c JOIN "BookProject" p ON p.id=c.projectId JOIN "BookProjectAdmin" a ON a.projectId=p.id WHERE p.title="Io, Napoleone" AND a.statoCommerciale="agente" AND c.status LIKE "agente_errore_%" ORDER BY c.position LIMIT 1); UPDATE "BookProject" SET status="agente_in_corso",updatedAt=strftime("%Y-%m-%dT%H:%M:%fZ","now") WHERE title="Io, Napoleone" AND (status="agente_in_pausa" OR (status="agente_in_esecuzione" AND datetime(updatedAt)<datetime("now","-20 minutes")));'

      - name: Wait until all twelve chapters are complete
        id: monitor
        shell: bash
        run: |
          set -uo pipefail
          for i in $(seq 1 24); do
            echo "--- Napoleon check $i/24 ---"
            if ! npx wrangler d1 execute splendoria-db --remote --json --command 'SELECT p.status AS project_status,p.updatedAt,(SELECT COUNT(*) FROM "BookChapter" c WHERE c.projectId=p.id) AS total_chapters,(SELECT COUNT(*) FROM "BookChapter" c WHERE c.projectId=p.id AND c.status="generato_agente") AS generated_chapters,(SELECT GROUP_CONCAT(c.position || ":" || c.status,"|") FROM "BookChapter" c WHERE c.projectId=p.id) AS chapter_states FROM "BookProject" p WHERE p.title="Io, Napoleone" ORDER BY p.createdAt LIMIT 1;' > napoleon-status.json; then
              echo "Remote status query failed."
              exit 5
            fi
            cat napoleon-status.json
            node <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('napoleon-status.json','utf8'));
          const rows = Array.isArray(data) ? data.flatMap(x => x.results || x.result || []) : (data.results || data.result || []);
          if (!rows.length) process.exit(3);
          const r = rows[0];
          console.log(`STATUS=${r.project_status} GENERATED=${r.generated_chapters}/${r.total_chapters}`);
          if (r.project_status === 'agente_completato') process.exit(0);
          if (r.project_status === 'agente_in_pausa') process.exit(2);
          process.exit(10);
          NODE
            code=$?
            if [ "$code" -eq 0 ]; then
              echo "Napoleon completed."
              exit 0
            fi
            if [ "$code" -eq 2 ]; then
              echo "Napoleon paused again after three quality failures."
              exit 2
            fi
            if [ "$code" -eq 3 ]; then
              echo "Napoleon project not found."
              exit 3
            fi
            sleep 60
          done
          echo "Timed out waiting for completion."
          exit 4

      - name: Capture final Napoleon status
        id: final_status
        if: always()
        shell: bash
        run: |
          mkdir -p ops
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            npx wrangler d1 execute splendoria-db --remote --json --command 'SELECT p.status,p.updatedAt,a.statoEditoriale,a.statoCommerciale FROM "BookProject" p LEFT JOIN "BookProjectAdmin" a ON a.projectId=p.id WHERE p.title="Io, Napoleone" ORDER BY p.createdAt LIMIT 1;' > ops/napoleon-project.json || echo '[]' > ops/napoleon-project.json
            npx wrangler d1 execute splendoria-db --remote --json --command 'SELECT c.position,c.title,c.status,length(c.content) AS chars FROM "BookChapter" c JOIN "BookProject" p ON p.id=c.projectId WHERE p.title="Io, Napoleone" ORDER BY c.position;' > ops/napoleon-chapters.json || echo '[]' > ops/napoleon-chapters.json
          else
            echo '[]' > ops/napoleon-project.json
            echo '[]' > ops/napoleon-chapters.json
          fi
          cat > ops/napoleon-run.txt <<EOF
          run_commit=${GITHUB_SHA}
          auth=${{ steps.auth.outcome }}
          validate=${{ steps.validate.outcome }}
          deploy_fast=${{ steps.deploy_fast.outcome }}
          inspect_before=${{ steps.inspect_before.outcome }}
          resume=${{ steps.resume.outcome }}
          monitor=${{ steps.monitor.outcome }}
          captured_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
          cat ops/napoleon-run.txt
          cat ops/napoleon-project.json
          cat ops/napoleon-chapters.json

      - name: Restore normal five-minute cron and deploy
        id: restore
        if: always()
        shell: bash
        run: |
          git checkout -- wrangler.jsonc
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            npx wrangler deploy || true
          fi

      - name: Publish operation report to repository
        if: always()
        shell: bash
        run: |
          git checkout -- wrangler.jsonc
          git config user.name "splendoria-operations"
          git config user.email "actions@users.noreply.github.com"
          git add ops/napoleon-run.txt ops/napoleon-project.json ops/napoleon-chapters.json
          if git diff --cached --quiet; then
            echo "No status report changes."
            exit 0
          fi
          git commit -m "ops: report Napoleon agent completion status"
          git push origin HEAD:splendoria.vip
