name: Validate Splendoria multilingual public site

on:
  push:
    branches:
      - feature/splendoria-i18n-vetrina-20260914
    paths:
      - src/i18n-showcase.js
      - src/i18n-selector.js
      - src/i18n-page-utils.js
      - src/i18n-guide.js
      - src/i18n-public.js
      - src/i18n-legal.js
      - src/studio-worker.js
      - public/assets/i18n-showcase.js
      - test/i18n-showcase.mjs
      - test/i18n-public.mjs
      - scripts/i18n-showcase-coverage.mjs
      - .github/workflows/splendoria-i18n-showcase-test.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout i18n branch
        uses: actions/checkout@v4
        with:
          ref: feature/splendoria-i18n-vetrina-20260914
      - name: Install dependencies
        run: npm ci
      - name: Syntax checks
        run: |
          node --check src/i18n-showcase.js
          node --check src/i18n-selector.js
          node --check src/i18n-page-utils.js
          node --check src/i18n-guide.js
          node --check src/i18n-public.js
          if [ -f src/i18n-legal.js ]; then node --check src/i18n-legal.js; fi
          node --check src/studio-worker.js
          node --check public/assets/i18n-showcase.js
          node --check test/i18n-showcase.mjs
          node --check test/i18n-public.mjs
          node --check scripts/i18n-showcase-coverage.mjs
      - name: Multilingual homepage tests
        run: node test/i18n-showcase.mjs
      - name: Multilingual public-page tests
        run: node test/i18n-public.mjs
      - name: Visible-text translation coverage
        run: node scripts/i18n-showcase-coverage.mjs
      - name: Wrangler dry run
        run: npm run check
