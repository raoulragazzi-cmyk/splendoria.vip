name: Verify Splendoria live preview 350

on:
  push:
    branches: ["splendoria.vip"]
    paths: [".github/workflows/verify-live-preview-350-20260901.yml"]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait for Cloudflare build
        run: sleep 25
      - name: Verify public release
        run: |
          set -euo pipefail
          html=$(curl -fsSL --retry 4 --retry-delay 4 https://www.splendoria.vip/)
          [[ "$html" == *'/assets/studio.js?v=20260901-4'* ]]
          js=$(curl -fsSL --retry 4 --retry-delay 4 'https://www.splendoria.vip/assets/studio.js?v=20260901-4')
          [[ "$js" == *'livePreviewFirstPageWords = 350'* ]]
          [[ "$js" == *'livePreviewWordsPerPage = 350'* ]]
          health=$(curl -fsSL --retry 4 --retry-delay 4 https://www.splendoria.vip/healthz)
          [[ "$health" == *'"status":"ok"'* ]]
          echo 'LIVE_PREVIEW_350_OK'
