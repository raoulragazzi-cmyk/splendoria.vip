name: Splendoria DE continuation (temporary)

on:
  push:
    branches: ["ux/de-dictation-safety-audit-20260917"]
    paths: [".github/workflows/de-continuation-snapshot-20260917.yml"]

permissions:
  contents: write

concurrency:
  group: de-continuation-snapshot-20260917
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Refuse concurrent or unexpected base
        run: |
          test "$(git rev-parse HEAD^)" = '20d11406dfda2b4ca3c3d18634c14822e5495b6f'
          test "$(git ls-remote origin refs/heads/ux/de-dictation-safety-audit-20260917 | cut -f1)" = "$GITHUB_SHA"
          mkdir -p qa-reports
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Record pre-existing smoke failure
        run: |
          set +e
          node test/smoke.mjs > qa-reports/smoke-before.log 2>&1
          result=$?
          set -e
          test "$result" = 1
          grep -F 'Vetrina: asset JavaScript non versionato contro la cache del browser' qa-reports/smoke-before.log
      - name: Apply exact reviewed patch (application, tests and documentation only)
        run: |
          python3 - <<'PY'
          import base64, lzma, hashlib, subprocess
          data = ''''''
          patch = lzma.decompress(base64.b64decode(data))
          assert hashlib.sha256(patch).hexdigest() == '8c5dfd0a0200989f99ea75c602c1c8c56555fd3f5aa7da3ed87e2c40635faa78'
          subprocess.run(['git','apply','--check','--unidiff-zero'], input=patch, check=True)
          subprocess.run(['git','apply','--unidiff-zero'], input=patch, check=True)
          PY
      - name: Run all scoped tests and characterize unchanged general-smoke blocker
        run: |
          set -o pipefail
          node --test test/studio-dictation-de-ux.test.mjs test/de-release-runtime.test.mjs | tee qa-reports/de-runtime.tap
          for file in test/*.mjs; do
            case "$file" in test/smoke.mjs|test/german-editorial-quality-cases.mjs) continue ;; esac
            node "$file" > "qa-reports/$(basename "$file").log" 2>&1 || { cat "qa-reports/$(basename "$file").log"; exit 1; }
          done
          set +e
          node test/smoke.mjs > qa-reports/smoke-after.log 2>&1
          result=$?
          set -e
          test "$result" = 1
          diff -u qa-reports/smoke-before.log qa-reports/smoke-after.log
          echo 'General smoke remains blocked by the identical pre-existing asset-version expectation; this is NOT a full-suite green result.' >> "$GITHUB_STEP_SUMMARY"
      - name: Isolated staging dry-run (no Cloudflare credentials, no publishing)
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: |
          set -o pipefail
          npm run check:staging | tee qa-reports/staging-dry-run.log
      - name: Commit only validated candidate files, never force push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --check
          git diff --exit-code -- src/worker.js src/studio-worker.js wrangler.jsonc migrations package.json package-lock.json
          test "$(git ls-remote origin refs/heads/ux/de-dictation-safety-audit-20260917 | cut -f1)" = "$GITHUB_SHA"
          git add docs/DE_RELEASE_PROGRESS_20260917.md docs/DE_UX_AUDIT_20260917.md src/i18n-auth-worker.js src/i18n-entry-worker.js src/i18n-legal-worker.js src/i18n-public-worker.js src/i18n-ui-runtime-worker.js src/i18n-worker.js src/studio-dictation-de-ux.js test/de-release-runtime.test.mjs test/helpers/dictation-harness.mjs test/studio-dictation-de-ux.test.mjs
          git diff --cached --name-only | tee qa-reports/changed-files.txt
          test "$(git diff --cached --name-only | wc -l)" = 12
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(de): preserve author edits, honor book language, complete public copy and verify final runtime'
          gh auth setup-git --hostname github.com
          git push origin HEAD:refs/heads/ux/de-dictation-safety-audit-20260917
          git rev-parse HEAD | tee qa-reports/candidate-sha.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: splendoria-de-v2-validation-${{ github.sha }}
          path: qa-reports/
          retention-days: 2
          if-no-files-found: error
