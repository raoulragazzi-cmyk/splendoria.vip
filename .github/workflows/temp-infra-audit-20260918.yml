name: TEMP Splendoria infra audit 2026-09-18

on:
  push:
    branches: ["infra/production-credentials-audit-20260918"]
    paths:
      - ".github/workflows/temp-infra-audit-20260918.yml"

permissions:
  contents: read

jobs:
  production-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - name: Report production secret presence only
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ]; then echo "CLOUDFLARE_API_TOKEN_PRESENT=yes"; else echo "CLOUDFLARE_API_TOKEN_PRESENT=no"; fi
          if [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then echo "CLOUDFLARE_ACCOUNT_ID_PRESENT=yes"; else echo "CLOUDFLARE_ACCOUNT_ID_PRESENT=no"; fi
          test -z "${CLOUDFLARE_API_TOKEN:-}" || curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" https://api.cloudflare.com/client/v4/user/tokens/verify -o /tmp/token.json
          if [ -s /tmp/token.json ]; then
            jq -c '{success,result:{status:.result.status,not_before:.result.not_before,expires_on:.result.expires_on}}' /tmp/token.json
          fi

  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Capture audit details without modifying lockfile
        shell: bash
        run: |
          set +e
          npm audit --json > /tmp/audit.json
          status=$?
          set -e
          echo "npm_audit_exit=$status"
          jq -c '{metadata:.metadata.vulnerabilities}' /tmp/audit.json
          jq -r '.vulnerabilities | to_entries[] | [.key,.value.severity,.value.isDirect,((.value.via|map(if type=="string" then . else (.title // .name // "") end))|join(" | ")),(.value.fixAvailable|tostring)] | @tsv' /tmp/audit.json
