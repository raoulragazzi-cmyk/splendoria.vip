name: TEMP validate tone i18n 2026-09-18

on:
  push:
    branches: ["fix/de-tone-options-20260918"]
    paths:
      - ".github/workflows/temp-validate-tone-i18n-20260918.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Tone canonical-value contract
        run: node test/i18n-editor-smoke.mjs
      - name: Related DE runtime regressions
        shell: bash
        run: |
          set -euo pipefail
          node test/i18n-visible-residuals-smoke.mjs
          node test/studio-deep-i18n-smoke.mjs
          node test/de-release-runtime.test.mjs
      - name: Security and Wrangler dry run
        shell: bash
        run: |
          npm audit --audit-level=high
          npx wrangler deploy --dry-run --env=""
