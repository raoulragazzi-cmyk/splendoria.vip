name: Deploy guarded Splendoria release

on:
  push:
    branches: ["splendoria.vip"]
    paths: [".github/workflows/splendoria-deploy-now.yml"]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: splendoria.vip

      - name: Install dependencies
        run: npm ci

      - name: Verify release source
        run: |
          node --check src/worker.js
          node --check src/studio-worker.js
          grep -Fq 'sourceWords < 50' src/worker.js
          grep -Fq 'restoreLastBookVersion' src/worker.js
          grep -Fq 'BookChapterSection' src/worker.js
          grep -Fq "L’indice esistente è protetto" src/worker.js
          grep -Fq '.cookie-banner.privacy-first[hidden]{display:none!important}' src/studio-worker.js

      - name: Wrangler dry run
        run: npm run check

      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo 'Cloudflare API token is not configured in repository secrets.'
            exit 78
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo 'Cloudflare account id is not configured in repository secrets.'
            exit 78
          fi

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy
