name: Splendoria staging deploy

on:
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: Git ref to deploy to isolated staging
        required: true
        default: integration/onboarding-zero-friction-20260916
        type: string

permissions:
  contents: read

concurrency:
  group: splendoria-staging-deploy
  cancel-in-progress: false

jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STAGING_BASE_URL: https://splendoria-v2-staging.raoulragazzi.workers.dev
    steps:
      - name: Checkout selected candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.candidate_ref }}
          fetch-depth: 0

      - name: Refuse production target
        shell: bash
        run: |
          set -euo pipefail
          case "$STAGING_BASE_URL" in
            https://www.splendoria.vip|https://splendoria.vip|http://www.splendoria.vip|http://splendoria.vip)
              echo "Refusing production URL."
              exit 1
              ;;
          esac
          grep -Fq '"name": "splendoria-v2-staging"' wrangler.jsonc
          grep -Fq '"database_name": "splendoria-v2-test"' wrangler.jsonc

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate isolated staging contract
        shell: bash
        run: |
          set -euo pipefail
          npm run check:staging
          for test_file in \
            test/progressive-book-setup-smoke.mjs \
            test/client-first-access-smoke.mjs \
            test/single-muse-cta-smoke.mjs \
            test/studio-cache-policy-smoke.mjs; do
            if [ -f "$test_file" ]; then node "$test_file"; fi
          done
          for test_file in test/i18n-*.mjs; do
            [ -e "$test_file" ] || continue
            node "$test_file"
          done

      - name: Require dedicated staging credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "Missing CLOUDFLARE_STAGING_API_TOKEN in GitHub environment staging"; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "Missing CLOUDFLARE_ACCOUNT_ID in GitHub environment staging"; exit 1; }

      - name: Deploy staging Worker only
        run: npx wrangler deploy --env staging

      - name: HTTP acceptance
        shell: bash
        run: |
          set -euo pipefail
          base="${STAGING_BASE_URL%/}"
          check_code() {
            path="$1"; expected="$2"
            code="$(curl -sS -o /tmp/spl-body -w '%{http_code}' "$base$path")"
            if [ "$code" != "$expected" ]; then
              echo "Unexpected HTTP $code for $path; expected $expected"
              head -c 1200 /tmp/spl-body || true
              exit 1
            fi
          }
          check_code /healthz 200
          check_code / 200
          check_code /registrati 200
          check_code /area-clienti 200
          check_code /area-amministratore 200
          check_code /accedi 303
          check_code /de/ 200
          check_code /en/ 200
          check_code /de/area-clienti 200
          check_code /en/area-clienti 200
          location="$(curl -sSI "$base/accedi" | tr -d '\r' | awk -F': ' 'tolower($1)=="location" {print $2}')"
          test "$location" = "/area-clienti" || { echo "Unexpected /accedi Location: $location"; exit 1; }
          echo "Staging deploy and HTTP acceptance passed."
