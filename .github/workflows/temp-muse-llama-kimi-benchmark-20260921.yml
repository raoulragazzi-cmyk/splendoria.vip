name: TEMP Muse Llama vs Kimi benchmark 2026-09-21

on:
  push:
    branches: ["bench/muse-llama-kimi-20260921"]
    paths:
      - ".github/workflows/temp-muse-llama-kimi-benchmark-20260921.yml"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BENCH_URL: https://splendoria-muse-benchmark-20260921.raoulragazzi.workers.dev
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      - name: Guard isolated benchmark topology
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '"name": "splendoria-muse-benchmark-20260921"' wrangler.muse-benchmark.jsonc
          grep -Fq '"main": "benchmark/muse-model-compare-worker.js"' wrangler.muse-benchmark.jsonc
          grep -Fq '"binding": "AI"' wrangler.muse-benchmark.jsonc
          ! grep -Eq 'd1_databases|send_email|routes|assets' wrangler.muse-benchmark.jsonc
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"

      - name: Deploy isolated AI benchmark Worker
        run: npx wrangler deploy --config wrangler.muse-benchmark.jsonc

      - name: Wait for benchmark Worker
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6 7 8; do
            code="$(curl -sS -o /tmp/health -w '%{http_code}' "$BENCH_URL/healthz" || true)"
            if [ "$code" = "200" ] && grep -Fq '"status":"ok"' /tmp/health; then exit 0; fi
            sleep $((attempt * 2))
          done
          cat /tmp/health || true
          exit 1

      - name: Run Llama vs Kimi editorial benchmark
        run: node scripts/muse-model-compare.mjs

      - name: Upload benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: muse-llama-kimi-benchmark-20260921
          path: benchmark-output/muse-model-compare.json
          retention-days: 7

      - name: Remove temporary benchmark Worker
        if: always()
        shell: bash
        run: |
          set +e
          curl -sS -X DELETE             -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"             "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/splendoria-muse-benchmark-20260921"             -o /tmp/delete.json
          cat /tmp/delete.json | jq -c '{success,errors}' || true
