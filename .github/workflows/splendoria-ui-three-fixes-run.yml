name: Run Splendoria UI three fixes

on:
  push:
    branches: ["splendoria.vip"]
    paths: [".github/workflows/splendoria-ui-three-fixes-run.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: splendoria.vip
          fetch-depth: 0
      - run: python .github/scripts/ui_three_fixes_20260901.py
      - run: npm ci
      - run: |
          node --check src/worker.js
          node --check src/studio-worker.js
          npm run check
      - name: Commit application files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/worker.js src/studio-worker.js
          git diff --cached --check
          git commit -m "fix: close privacy notice, dedupe Musa, add back to top"
          git push origin HEAD:splendoria.vip
