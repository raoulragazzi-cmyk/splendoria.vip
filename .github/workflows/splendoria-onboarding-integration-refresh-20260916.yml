name: Splendoria onboarding integration refresh

on:
  push:
    branches:
      - integration/onboarding-friction-pass-20260916
    paths:
      - ".github/workflows/splendoria-onboarding-integration-refresh-20260916.yml"

permissions:
  contents: write

jobs:
  refresh-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: integration/onboarding-friction-pass-20260916
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - name: Merge latest client-first branch without conflict resolution
        run: |
          git config user.name "splendoria-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch --no-tags origin ux/client-first-access-20260916
          git merge --no-ff --no-edit origin/ux/client-first-access-20260916
      - run: npm ci
      - name: Validate combined baseline
        shell: bash
        run: |
          set -euo pipefail
          node test/studio-cache-policy-smoke.mjs
          node test/single-muse-cta-smoke.mjs
          node test/client-first-access-smoke.mjs
          node test/studio-button-contract-smoke.mjs
          for test_file in test/i18n-*.mjs; do node "$test_file"; done
          set +e
          npm test 2>&1 | tee /tmp/smoke.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            if grep -Fq 'Accessibilità: navigazione da tastiera, focus o riduzione del movimento incompleti' /tmp/smoke.log; then
              echo 'Known baseline accessibility assertion only.'
            else
              exit "$status"
            fi
          fi
          npm run check
          git diff --check
      - name: Push refreshed integration branch
        run: git push origin HEAD:integration/onboarding-friction-pass-20260916
      - name: Remove one-shot workflow
        run: |
          git rm .github/workflows/splendoria-onboarding-integration-refresh-20260916.yml
          git commit -m "chore: remove completed onboarding integration refresh"
          git push origin HEAD:integration/onboarding-friction-pass-20260916
