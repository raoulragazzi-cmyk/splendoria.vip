name: Splendoria onboarding integration QA

on:
  push:
    branches:
      - integration/onboarding-friction-pass-20260916
    paths:
      - ".github/workflows/splendoria-onboarding-integration-20260916.yml"

permissions:
  contents: write

jobs:
  integrate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v5
        with:
          ref: integration/onboarding-friction-pass-20260916
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Fetch candidate branches
        run: |
          git fetch --no-tags origin \
            fix/studio-js-cache-policy-20260916 \
            ux/single-muse-cta-20260916 \
            ux/client-first-access-20260916 \
            splendoria.vip

      - name: Merge candidates without conflict resolution
        run: |
          git config user.name "splendoria-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git merge --no-ff --no-edit origin/fix/studio-js-cache-policy-20260916
          git merge --no-ff --no-edit origin/ux/single-muse-cta-20260916
          git merge --no-ff --no-edit origin/ux/client-first-access-20260916

      - name: Install dependencies
        run: npm ci

      - name: Focused contracts
        run: |
          node --check src/worker.js
          node --check src/studio-worker.js
          node test/studio-cache-policy-smoke.mjs
          node test/single-muse-cta-smoke.mjs
          node test/client-first-access-smoke.mjs
          node test/studio-button-contract-smoke.mjs
          node test/i18n-auth-smoke.mjs

      - name: Full multilingual regression
        shell: bash
        run: |
          set -euo pipefail
          for test_file in test/i18n-*.mjs; do
            echo "Running $test_file"
            node "$test_file"
          done

      - name: Application smoke and Wrangler dry run
        shell: bash
        run: |
          set -o pipefail
          set +e
          npm test 2>&1 | tee /tmp/splendoria-smoke.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            if grep -Fq 'Accessibilità: navigazione da tastiera, focus o riduzione del movimento incompleti' /tmp/splendoria-smoke.log; then
              echo 'Known baseline accessibility assertion only.'
            else
              echo 'Unexpected application smoke failure.'
              exit "$status"
            fi
          fi
          npm run check
          git diff --check

      - name: Push validated integration branch
        run: |
          git push origin HEAD:integration/onboarding-friction-pass-20260916

      - name: Remove one-shot workflow
        run: |
          git rm .github/workflows/splendoria-onboarding-integration-20260916.yml
          git commit -m "chore: remove completed onboarding integration workflow"
          git push origin HEAD:integration/onboarding-friction-pass-20260916
