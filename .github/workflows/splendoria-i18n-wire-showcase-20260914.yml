name: Wire Splendoria showcase i18n

on:
  push:
    branches:
      - feature/splendoria-i18n-vetrina-20260914
    paths:
      - .github/workflows/splendoria-i18n-wire-showcase-20260914.yml
      - scripts/wire-showcase-i18n.mjs

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout i18n branch
        uses: actions/checkout@v4
        with:
          ref: feature/splendoria-i18n-vetrina-20260914
          fetch-depth: 0

      - name: Install dependencies
        run: npm ci

      - name: Wire isolated routing layer
        run: node scripts/wire-showcase-i18n.mjs

      - name: Validate sources and dry run
        run: |
          node --check src/i18n-showcase.js
          node --check src/studio-worker.js
          node --check public/assets/i18n-showcase.js
          npm run check
          grep -Fq localizedShowcaseRoute src/studio-worker.js

      - name: Commit guarded i18n wiring
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/studio-worker.js src/i18n-showcase.js
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "i18n wiring already current."
          else
            git commit -m "fix: harden multilingual showcase routing"
            git push origin HEAD:feature/splendoria-i18n-vetrina-20260914
          fi
