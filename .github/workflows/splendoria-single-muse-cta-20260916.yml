name: Splendoria single Muse CTA cleanup

on:
  push:
    branches:
      - ux/single-muse-cta-20260916
    paths:
      - ".github/workflows/splendoria-single-muse-cta-20260916.yml"

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: ux/single-muse-cta-20260916
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply guarded UX patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/worker.js')
          text = path.read_text(encoding='utf-8')
          old = '''<div class="actions"><button class="button">Salva le mie modifiche</button><button class="button secondary muse-draft-button" formaction="/libro/${id}/capitolo/${c.id}/genera">${c.content ? "Crea una nuova versione" : "Scrivi questo capitolo con me"}</button></div>'''
          new = '''<div class="actions"><button class="button">Salva le mie modifiche</button></div>'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'guard failed: expected exactly 1 duplicate chapter Muse CTA, found {count}')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          print('removed exactly one duplicate chapter-level Muse CTA')
          PY

          cat > test/single-muse-cta-smoke.mjs <<'EOF'
          import { readFileSync } from "node:fs";

          const worker = readFileSync(new URL("../src/worker.js", import.meta.url), "utf8");
          const duplicate = 'class="button secondary muse-draft-button" formaction="/libro/${id}/capitolo/${c.id}/genera"';
          if (worker.includes(duplicate)) throw new Error("Studio chapter: duplicate bottom Muse CTA still present");
          const primary = '<button class="muse-draft-button" formaction="/libro/${id}/capitolo/${c.id}/genera" formnovalidate>Affidati alla Musa</button>';
          if (!worker.includes(primary)) throw new Error("Studio chapter: primary Affidati alla Musa CTA missing");
          if (!worker.includes('<button class="button">Salva le mie modifiche</button>')) throw new Error("Studio chapter: explicit save CTA missing");
          console.log("single Muse CTA: primary generation action preserved; duplicate removed");
          EOF

      - name: Validate syntax and focused contracts
        run: |
          node --check src/worker.js
          node --check test/single-muse-cta-smoke.mjs
          node test/single-muse-cta-smoke.mjs
          if [ -f test/studio-button-contract-smoke.mjs ]; then node test/studio-button-contract-smoke.mjs; fi
          npm test || status=$?
          if [ "${status:-0}" -ne 0 ]; then
            npm test 2>&1 | tee /tmp/smoke.log || true
            if grep -Fq 'Vetrina: asset JavaScript non versionato contro la cache del browser' /tmp/smoke.log || grep -Fq 'Accessibilità: navigazione da tastiera, focus o riduzione del movimento incompleti' /tmp/smoke.log; then
              echo 'Only a known baseline smoke assertion remains.'
            else
              exit "$status"
            fi
          fi
          npm run check
          git diff --check

      - name: Commit application change
        run: |
          git config user.name "splendoria-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/worker.js test/single-muse-cta-smoke.mjs
          git commit -m "ux: keep one primary Muse CTA per chapter"
          git push origin HEAD:ux/single-muse-cta-20260916

      - name: Remove one-shot workflow
        run: |
          git pull --ff-only origin ux/single-muse-cta-20260916
          git rm .github/workflows/splendoria-single-muse-cta-20260916.yml
          git commit -m "chore: remove completed one-shot Muse CTA workflow"
          git push origin HEAD:ux/single-muse-cta-20260916
