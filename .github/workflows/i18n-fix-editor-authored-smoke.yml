name: Repair i18n editor authored-content smoke assertion

on:
  push:
    branches: ["i18n/public-de-en-phase1"]
    paths:
      - ".github/workflows/i18n-fix-editor-authored-smoke.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: i18n/public-de-en-phase1
      - name: Patch semantic authored-content assertion
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('test/i18n-editor-smoke.mjs')
          text = path.read_text()
          old = '''  const authored = [PROJECT.title, PROJECT.sourceMaterial, PROJECT.story, PROJECT.people, PROJECT.events, PROJECT.message];
  for (const value of authored) if (!editor.includes(value)) throw new Error(`editor ${locale}: contenuto autore alterato: ${value}`);'''
          new = '''  const authored = [PROJECT.title, PROJECT.sourceMaterial, PROJECT.story, PROJECT.people, PROJECT.events, PROJECT.message];
  const escapedHtml = value => String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#39;");
  for (const value of authored) {
    const preserved = editor.includes(value) || editor.includes(escapedHtml(value));
    if (!preserved) throw new Error(`editor ${locale}: contenuto autore alterato: ${value}`);
  }'''
          if old not in text:
              raise SystemExit('target assertion not found; refusing broad patch')
          path.write_text(text.replace(old, new))
          PY
          node --check test/i18n-editor-smoke.mjs
      - name: Commit patch and remove one-shot workflow
        run: |
          git config user.name "Splendoria CI"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/i18n-fix-editor-authored-smoke.yml
          git add test/i18n-editor-smoke.mjs
          git commit -m "test(i18n): compare authored content after HTML escaping"
          git push origin HEAD:i18n/public-de-en-phase1
