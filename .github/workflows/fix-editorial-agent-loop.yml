name: Repair editorial agent retry loop

on:
  push:
    branches: ["splendoria.vip"]
    paths: [".github/workflows/fix-editorial-agent-loop.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: splendoria.vip
          fetch-depth: 0
      - name: Apply repair
        run: python3 .github/scripts/fix_editorial_agent.py
      - name: Syntax check
        run: node --check src/worker.js
      - name: Commit repaired worker
        run: |
          if git diff --quiet -- src/worker.js; then
            echo "Worker already repaired; nothing to commit."
            exit 0
          fi
          git config user.name "splendoria-maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add src/worker.js
          git commit -m "fix: repair editorial agent retry loop"
          git push origin HEAD:splendoria.vip
