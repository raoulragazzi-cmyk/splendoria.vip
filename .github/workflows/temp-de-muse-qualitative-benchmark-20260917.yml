name: TEMP DE Muse qualitative benchmark 2026-09-17

on:
  push:
    branches: ["ai/de-muse-dual-model-20260917"]
    paths:
      - "test/fixtures/de-muse-qualitative-cases.json"
      - "scripts/de-muse-qualitative-benchmark.mjs"
      - "src/de-muse-benchmark-worker.js"
      - "wrangler.de-muse-benchmark.jsonc"
      - ".github/workflows/temp-de-muse-qualitative-benchmark-20260917.yml"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BENCHMARK_URL: https://splendoria-de-muse-benchmark-20260917.raoulragazzi.workers.dev
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Guard isolated benchmark contract
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          grep -Fq 'splendoria-de-muse-benchmark-20260917' wrangler.de-muse-benchmark.jsonc
          ! grep -Fq 'd1_databases' wrangler.de-muse-benchmark.jsonc
          ! grep -Fq 'routes' wrangler.de-muse-benchmark.jsonc
          ! grep -Fq 'send_email' wrangler.de-muse-benchmark.jsonc
          BENCH_TOKEN="$(openssl rand -hex 24)"
          echo "BENCH_TOKEN=$BENCH_TOKEN" >> "$GITHUB_ENV"
      - name: Deploy ephemeral benchmark worker only
        run: npx wrangler deploy --config wrangler.de-muse-benchmark.jsonc --var "BENCH_TOKEN:${BENCH_TOKEN}"
      - name: Wait for ephemeral worker propagation
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6 7 8; do
            code="$(curl -sS -o /tmp/bench-health -w '%{http_code}' "$BENCHMARK_URL/healthz" || true)"
            if [ "$code" = "200" ] && grep -Fq '"benchmark":true' /tmp/bench-health; then
              echo "Benchmark worker ready on attempt $attempt."
              exit 0
            fi
            echo "Benchmark worker not ready yet (attempt $attempt, HTTP ${code:-none})."
            sleep $((attempt * 2))
          done
          echo "Benchmark worker failed to become ready."
          cat /tmp/bench-health || true
          exit 1
      - name: Run live model comparison
        run: node scripts/de-muse-qualitative-benchmark.mjs
      - name: Upload qualitative reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: de-muse-qualitative-report
          path: benchmark-output/
          if-no-files-found: ignore
          retention-days: 7
      - name: Delete ephemeral benchmark worker
        if: always()
        shell: bash
        run: npx wrangler delete --config wrangler.de-muse-benchmark.jsonc --force || true
