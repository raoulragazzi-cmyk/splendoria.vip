name: TEMP DE Muse qualitative benchmark 2026-09-17

on:
  push:
    branches: ["ai/de-muse-dual-model-20260917"]
    paths:
      - "test/fixtures/de-muse-qualitative-cases.json"
      - "scripts/de-muse-qualitative-benchmark.mjs"
      - ".github/workflows/temp-de-muse-qualitative-benchmark-20260917.yml"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Guard benchmark credentials only
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
      - name: Run live model comparison without deploy
        run: node scripts/de-muse-qualitative-benchmark.mjs
      - name: Upload qualitative reports
        uses: actions/upload-artifact@v4
        with:
          name: de-muse-qualitative-report
          path: benchmark-output/
          retention-days: 7
