name: TEMP microphone paragraph regression 2026-09-18

on:
  push:
    branches: ["research/mic-muse-kimi-20260918"]
    paths:
      - ".github/workflows/temp-mic-paragraph-regression-20260918.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: node --test test/studio-dictation-de-ux.test.mjs

# rerun after paragraph-boundary fix
