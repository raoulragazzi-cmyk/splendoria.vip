name: TEMP microphone paragraph regression 2026-09-18

on:
  push:
    branches: ["research/mic-muse-kimi-20260918"]
    paths:
      - ".github/workflows/temp-mic-paragraph-regression-20260918.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Run dictation suite and capture diagnostics
        shell: bash
        run: |
          set +e
          node --test test/studio-dictation-de-ux.test.mjs > /tmp/mic-test.log 2>&1
          status=$?
          set -e
          cat /tmp/mic-test.log
          echo "$status" > /tmp/mic-test.status
      - uses: actions/upload-artifact@v4
        with:
          name: mic-test-diagnostics
          path: |
            /tmp/mic-test.log
            /tmp/mic-test.status
          retention-days: 2
