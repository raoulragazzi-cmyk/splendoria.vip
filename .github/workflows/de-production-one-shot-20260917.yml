name: Splendoria DE production one-shot

on:
  push:
    branches: ["splendoria.vip"]
    paths: [".github/workflows/de-production-one-shot-20260917.yml"]

permissions:
  contents: read

concurrency:
  group: splendoria-production-de-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROD_BASE_URL: https://www.splendoria.vip
    steps:
      - name: Checkout exact production commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate production candidate
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          for test_file in test/i18n-*.mjs; do
            [ -e "$test_file" ] || continue
            node "$test_file"
          done
          node test/studio-dictation-de-ux.test.mjs
          node test/de-release-runtime.test.mjs
      - name: Guard production target and credentials
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '"name": "splendoria-v2"' wrangler.jsonc
          grep -Fq '"database_name": "splendoria-db"' wrangler.jsonc
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
      - name: Deploy production without DB migrations
        run: npx wrangler deploy
      - name: Production HTTP acceptance
        shell: bash
        run: |
          set -euo pipefail
          base="${PROD_BASE_URL%/}"
          for path in /healthz / /de/ /en/ /de/guida /en/guida /de/area-clienti /en/area-clienti /de/registrati; do
            code="$(curl -sS -o /tmp/body -w '%{http_code}' "$base$path")"
            case "$code" in
              200|204|301|302|303|307|308) ;;
              *) echo "Unexpected HTTP $code for $path"; head -c 1200 /tmp/body || true; exit 1;;
            esac
          done
          echo "Production acceptance passed."
