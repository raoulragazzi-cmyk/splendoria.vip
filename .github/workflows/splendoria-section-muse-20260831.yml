name: Splendoria per-section Musa 2026-08-31

on:
  push:
    branches:
      - splendoria.vip
    paths:
      - .github/workflows/splendoria-section-muse-20260831.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: splendoria.vip
          fetch-depth: 0

      - name: Patch only per-section Musa
        run: python .github/scripts/section_muse_patch_20260831_v2.py

      - name: Install dependencies
        run: npm ci

      - name: Syntax and Wrangler dry run
        run: |
          node --check src/studio-worker.js
          node --check src/worker.js
          npm run check

      - name: Commit only Musa section changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/studio-worker.js src/worker.js
          git diff --cached --check
          git diff --cached --stat
          git commit -m "feat: add Musa help to each chapter section"
          git push origin HEAD:splendoria.vip
