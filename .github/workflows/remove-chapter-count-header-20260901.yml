name: Splendoria chapter header cleanup

on:
  push:
    branches: ["splendoria.vip"]
    paths: [".github/workflows/remove-chapter-count-header-20260901.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: splendoria.vip
          fetch-depth: 0
      - run: python .github/scripts/remove_chapter_count_header_20260901.py
      - run: npm ci
      - run: |
          node --check src/worker.js
          npm run check
      - name: Commit application source
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/worker.js
          git diff --cached --check
          git commit -m "fix: remove duplicate chapter count from navigator title"
          git push origin HEAD:splendoria.vip
