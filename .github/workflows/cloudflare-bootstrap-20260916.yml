name: Bootstrap isolated Splendoria staging

on:
  push:
    branches:
      - infra/cloudflare-bootstrap-20260916
    paths:
      - ".github/workflows/cloudflare-bootstrap-20260916.yml"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    env:
      LEGACY_CF_SECRET: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_EMAIL: raoulragazzi@gmail.com
      STAGING_BASE_URL: https://splendoria-v2-staging.raoulragazzi.workers.dev
    steps:
      - name: Checkout onboarding candidate
        uses: actions/checkout@v5
        with:
          ref: integration/onboarding-zero-friction-20260916
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate isolated staging before authentication
        shell: bash
        run: |
          set -euo pipefail
          npm run check:staging
          node test/staging-config-smoke.mjs
          test "$(node -e "const c=require('./wrangler.jsonc');")" = "" 2>/dev/null || true

      - name: Detect existing Cloudflare credential mode without exposing secret
        shell: bash
        run: |
          set -euo pipefail
          test -n "${LEGACY_CF_SECRET:-}" || { echo "legacy Cloudflare secret missing"; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "Cloudflare account id missing"; exit 1; }
          raw="$LEGACY_CF_SECRET"
          clean="$(printf '%s' "$raw" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/^[Bb][Ee][Aa][Rr][Ee][Rr][[:space:]]\+//')"
          test -n "$clean" || { echo "Cloudflare secret empty after normalization"; exit 1; }
          token_ok="$(curl -sS https://api.cloudflare.com/client/v4/user/tokens/verify -H "Authorization: Bearer $clean" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{try{console.log(JSON.parse(d).success===true?'yes':'no')}catch{console.log('no')}})")"
          key_ok="$(curl -sS https://api.cloudflare.com/client/v4/user -H "X-Auth-Email: $CLOUDFLARE_EMAIL" -H "X-Auth-Key: $clean" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{try{console.log(JSON.parse(d).success===true?'yes':'no')}catch{console.log('no')}})")"
          if [ "$token_ok" = yes ]; then
            echo "Cloudflare credential mode: API token"
            printf 'CF_AUTH_MODE=token\n' >> "$GITHUB_ENV"
            printf 'CLOUDFLARE_API_TOKEN=%s\n' "$clean" >> "$GITHUB_ENV"
          elif [ "$key_ok" = yes ]; then
            echo "Cloudflare credential mode: Global API key"
            printf 'CF_AUTH_MODE=global_key\n' >> "$GITHUB_ENV"
            printf 'CLOUDFLARE_API_KEY=%s\n' "$clean" >> "$GITHUB_ENV"
          else
            echo "Existing Cloudflare secret is neither a valid API token nor a valid Global API key"
            exit 1
          fi
          unset clean raw LEGACY_CF_SECRET

      - name: Deploy candidate to isolated staging
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_KEY: ${{ env.CLOUDFLARE_API_KEY }}
        run: |
          set -euo pipefail
          if [ "${CF_AUTH_MODE:-}" = global_key ]; then
            unset CLOUDFLARE_API_TOKEN
            export CLOUDFLARE_API_KEY
            export CLOUDFLARE_EMAIL
          else
            unset CLOUDFLARE_API_KEY
            export CLOUDFLARE_API_TOKEN
          fi
          npx wrangler deploy --env staging

      - name: HTTP acceptance
        shell: bash
        run: |
          set -euo pipefail
          base="${STAGING_BASE_URL%/}"
          check_code() {
            path="$1"; expected="$2"
            code="$(curl -sS -o /tmp/spl-body -w '%{http_code}' "$base$path")"
            if [ "$code" != "$expected" ]; then
              echo "Unexpected HTTP $code for $path; expected $expected"
              head -c 800 /tmp/spl-body || true
              exit 1
            fi
          }
          check_code /healthz 200
          check_code / 200
          check_code /registrati 200
          check_code /area-clienti 200
          check_code /area-amministratore 200
          check_code /accedi 303
          check_code /de/ 200
          check_code /en/ 200
          location="$(curl -sSI "$base/accedi" | tr -d '\r' | awk -F': ' 'tolower($1)=="location" {print $2}')"
          test "$location" = "/area-clienti" || { echo "Unexpected /accedi Location: $location"; exit 1; }
          echo "Bootstrap staging deploy and HTTP acceptance passed."

      - name: Remove one-shot bootstrap workflow
        if: success()
        shell: bash
        run: |
          git config user.name "splendoria-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin infra/cloudflare-bootstrap-20260916
          git checkout -B infra/cloudflare-bootstrap-20260916 origin/infra/cloudflare-bootstrap-20260916
          git rm .github/workflows/cloudflare-bootstrap-20260916.yml
          git commit -m "chore: remove completed Cloudflare bootstrap workflow"
          git push origin HEAD:infra/cloudflare-bootstrap-20260916
