name: Hotfix Splendoria mobile viewport

on:
  push:
    branches: ["splendoria.vip"]
    paths: [".github/workflows/hotfix-mobile-viewport.yml"]

permissions:
  contents: read

jobs:
  hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: splendoria-v2
    steps:
      - name: Verify credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Record current deployment
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/deployments" \
            > deployment-before.json
          python - <<'PY'
          import json
          d=json.load(open('deployment-before.json'))
          assert d.get('success') is True, d
          deps=(d.get('result') or {}).get('deployments') or d.get('result') or []
          print('ROLLBACK_DEPLOYMENT=', deps[0].get('id') if deps else 'unknown')
          print('ROLLBACK_VERSIONS=', deps[0].get('versions') if deps else [])
          PY

      - name: Download exact production Worker
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -D worker.headers \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME" \
            -o worker.original.multipart
          grep -i '^content-type:' worker.headers | tail -1 | sed 's/^[Cc]ontent-[Tt]ype:[[:space:]]*//' | tr -d '\r' > content-type.txt
          test -s content-type.txt
          sha256sum worker.original.multipart

      - name: Patch only the home mobile viewport
        shell: python
        run: |
          from pathlib import Path
          src = Path('worker.original.multipart').read_text(encoding='utf-8')
          marker = 'data-spl-mobile-viewport-patch'
          if marker in src:
              raise SystemExit('Viewport hotfix is already present; refusing duplicate patch')

          anchor = 'const contentType = response.headers.get("content-type") || "";'
          if src.count(anchor) != 1:
              raise SystemExit(f'Expected exactly one patchedFetch contentType anchor, found {src.count(anchor)}')

          injection = '''const contentType = response.headers.get("content-type") || "";\n  if (url.pathname === "/" && contentType.includes("text/html")) {\n    const html = await response.text();\n    const headers = new Headers(response.headers);\n    headers.delete("content-length");\n    const viewport = '<meta name="viewport" content="width=device-width, initial-scale=1" data-spl-mobile-viewport-patch>';\n    const patched = /<meta\\s+name=["\\']viewport["\\']/i.test(html) ? html : html.replace(/<head([^>]*)>/i, '<head$1>' + viewport);\n    return new Response(patched, { status: response.status, statusText: response.statusText, headers });\n  }'''
          patched = src.replace(anchor, injection, 1)
          if patched.count(marker) != 1:
              raise SystemExit('Viewport marker validation failed')
          # Guardrail: this hotfix must be one local insertion only.
          if len(patched) - len(src) > 900 or len(patched) <= len(src):
              raise SystemExit('Unexpected patch size')
          Path('worker.patched.multipart').write_text(patched, encoding='utf-8')
          print('PATCH_BYTES=', len(patched)-len(src))

      - name: Upload patched production Worker
        shell: bash
        run: |
          set -euo pipefail
          CONTENT_TYPE="$(cat content-type.txt)"
          curl -fsS -X PUT \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: $CONTENT_TYPE" \
            --data-binary @worker.patched.multipart \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME" \
            > upload-result.json
          python - <<'PY'
          import json
          d=json.load(open('upload-result.json'))
          assert d.get('success') is True, d
          print('UPLOAD_OK')
          PY

      - name: Verify production source and live home
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME" \
            -o worker.after.multipart
          python - <<'PY'
          from pathlib import Path
          s=Path('worker.after.multipart').read_text(encoding='utf-8')
          assert s.count('data-spl-mobile-viewport-patch') == 1
          print('SOURCE_VERIFY_OK')
          PY
          for i in 1 2 3 4 5; do
            HOME="$(curl -fsS -H 'Cache-Control: no-cache' "https://www.splendoria.vip/?viewport_hotfix_check=$RANDOM")" || true
            if printf '%s' "$HOME" | grep -q 'name="viewport"' && printf '%s' "$HOME" | grep -q 'width=device-width'; then
              echo 'LIVE_HOME_VIEWPORT_OK'
              exit 0
            fi
            sleep 3
          done
          echo 'Live home did not expose viewport after deploy' >&2
          exit 1
