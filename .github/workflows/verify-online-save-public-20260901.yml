name: Verify Splendoria online-save release

on:
  push:
    branches: ["splendoria.vip"]
    paths: [".github/workflows/verify-online-save-public-20260901.yml"]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait for Cloudflare build
        run: sleep 25
      - name: Verify public release
        run: |
          set -euo pipefail
          html=$(curl -fsSL --retry 4 --retry-delay 4 https://www.splendoria.vip/)
          [[ "$html" == *'/assets/studio.js?v=20260901-2'* ]]
          js=$(curl -fsSL --retry 4 --retry-delay 4 'https://www.splendoria.vip/assets/studio.js?v=20260901-2')
          [[ "$js" == *'Salvato online nel tuo account'* ]]
          [[ "$js" == *'autosalva-progetto'* ]]
          health=$(curl -fsSL --retry 4 --retry-delay 4 https://www.splendoria.vip/healthz)
          [[ "$health" == *'"status":"ok"'* ]]
          echo 'ONLINE_SAVE_RELEASE_OK'
