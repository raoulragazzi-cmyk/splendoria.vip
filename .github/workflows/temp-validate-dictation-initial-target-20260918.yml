name: TEMP validate dictation initial target 2026-09-18

on:
  push:
    branches: ["fix/de-dictation-initial-target-20260918"]
    paths:
      - ".github/workflows/temp-validate-dictation-initial-target-20260918.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Dictation deep pass
        shell: bash
        run: |
          set -euo pipefail
          node test/studio-dictation-de-ux.test.mjs
          node test/de-release-runtime.test.mjs
          node test/studio-button-contract-smoke.mjs
      - name: Security and dry run
        shell: bash
        run: |
          npm audit --audit-level=high
          npx wrangler deploy --dry-run --env=""
