name: Splendoria live preview fill

on:
  push:
    branches: ["splendoria.vip"]
    paths: [".github/workflows/fill-live-preview-page-20260901.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: splendoria.vip
          fetch-depth: 0
      - run: python .github/scripts/fill_live_preview_page_20260901.py
      - run: npm ci
      - run: |
          node --check src/worker.js
          npm run check
      - name: Commit application source
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/worker.js
          git diff --cached --check
          git commit -m "fix: fill live A5 preview page"
          git push origin HEAD:splendoria.vip
