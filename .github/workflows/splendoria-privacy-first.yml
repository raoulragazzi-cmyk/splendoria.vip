name: Splendoria privacy-first legal refresh

on:
  push:
    branches: ["splendoria.vip"]
    paths: [".github/workflows/splendoria-privacy-first.yml"]

permissions:
  contents: write

jobs:
  privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: splendoria.vip
          fetch-depth: 0

      - name: Make CSS anchor deterministic in CI workspace
        shell: python
        run: |
          from pathlib import Path
          p = Path('.github/scripts/privacy_patch.py')
          s = p.read_text(encoding='utf-8')
          old = "    if worker.count(anchor) != 1:\n        raise SystemExit(f'privacy banner CSS anchor expected 1, found {worker.count(anchor)}')\n    worker = worker.replace(anchor, '\\n' + css + anchor, 1)"
          new = "    if anchor not in worker:\n        raise SystemExit('privacy banner CSS anchor not found')\n    worker = worker.replace(anchor, '\\n' + css + anchor, 1)"
          if old not in s:
              raise SystemExit('expected CSS guard not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

      - name: Patch banner and legal pages only
        run: python .github/scripts/privacy_patch.py

      - name: Install dependencies
        run: npm ci

      - name: Wrangler dry run
        run: npm run check

      - name: Commit only legal/privacy application changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/worker.js src/studio-worker.js
          git diff --cached --check
          git diff --cached --stat
          git commit -m "legal: privacy-first notice and current GDPR cookie disclosures"
          git push origin HEAD:splendoria.vip
