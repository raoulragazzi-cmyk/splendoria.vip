name: Validate trilingual Studio and Muse brain

on:
  push:
    branches: ["feature/studio-brain-trilingual", "postprod/studio-deep-i18n-brain", "postprod/de-ghostwriter-brain-v2"]
    paths:
      - "src/studio-language-worker.js"
      - "src/studio-deep-i18n-worker.js"
      - "src/german-ghostwriter-worker.js"
      - "src/german-ghostwriter-style-v2-worker.js"
      - "migrations/0005_book_language_preferences.sql"
      - "test/studio-language-smoke.mjs"
      - "test/studio-deep-i18n-smoke.mjs"
      - "test/studio-dynamic-residuals-smoke.mjs"
      - "test/german-ghostwriter-smoke.mjs"
      - "test/german-ghostwriter-style-v2-smoke.mjs"
      - "wrangler.jsonc"
      - ".github/workflows/studio-brain-trilingual-check.yml"
  pull_request:
    branches: ["splendoria.vip"]
    paths:
      - "src/studio-language-worker.js"
      - "src/studio-deep-i18n-worker.js"
      - "src/german-ghostwriter-worker.js"
      - "src/german-ghostwriter-style-v2-worker.js"
      - "migrations/0005_book_language_preferences.sql"
      - "test/studio-language-smoke.mjs"
      - "test/studio-deep-i18n-smoke.mjs"
      - "test/studio-dynamic-residuals-smoke.mjs"
      - "test/german-ghostwriter-smoke.mjs"
      - "test/german-ghostwriter-style-v2-smoke.mjs"
      - "wrangler.jsonc"
      - ".github/workflows/studio-brain-trilingual-check.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fetch production baseline
        run: git fetch --no-tags origin splendoria.vip:refs/remotes/origin/splendoria.vip

      - name: Install dependencies
        run: npm ci

      - name: Syntax
        run: |
          node --check src/studio-language-worker.js
          node --check src/studio-deep-i18n-worker.js
          node --check test/studio-language-smoke.mjs
          node --check test/studio-deep-i18n-smoke.mjs
          node --check test/studio-dynamic-residuals-smoke.mjs
          if [ -f src/german-ghostwriter-worker.js ]; then node --check src/german-ghostwriter-worker.js; fi
          if [ -f src/german-ghostwriter-style-v2-worker.js ]; then node --check src/german-ghostwriter-style-v2-worker.js; fi
          if [ -f test/german-ghostwriter-smoke.mjs ]; then node --check test/german-ghostwriter-smoke.mjs; fi
          if [ -f test/german-ghostwriter-style-v2-smoke.mjs ]; then node --check test/german-ghostwriter-style-v2-smoke.mjs; fi

      - name: Guard canonical Italian application source
        run: git diff --exit-code origin/splendoria.vip...HEAD -- src/worker.js src/studio-worker.js

      - name: Validate additive migration
        shell: bash
        run: |
          set -euo pipefail
          file=migrations/0005_book_language_preferences.sql
          grep -Fq 'CREATE TABLE IF NOT EXISTS "BookLanguagePreference"' "$file"
          grep -Fq '"bookLanguage" TEXT NOT NULL DEFAULT '\''it-IT'\''' "$file"
          grep -Fq '"museOutputLanguage" TEXT NOT NULL DEFAULT '\''it-IT'\''' "$file"
          grep -Fq '"dictationLanguage" TEXT NOT NULL DEFAULT '\''it-IT'\''' "$file"
          ! grep -Eqi 'DROP TABLE|ALTER TABLE.*DROP|DELETE FROM|UPDATE "BookProject"' "$file"

      - name: Studio language architecture smoke
        run: node test/studio-language-smoke.mjs

      - name: Deep Studio and Muse safety smoke
        run: |
          node test/studio-deep-i18n-smoke.mjs
          node test/studio-dynamic-residuals-smoke.mjs
          if [ -f test/german-ghostwriter-smoke.mjs ]; then node test/german-ghostwriter-smoke.mjs; fi
          if [ -f test/german-ghostwriter-style-v2-smoke.mjs ]; then node test/german-ghostwriter-style-v2-smoke.mjs; fi

      - name: Existing multilingual suites
        shell: bash
        run: |
          set -euo pipefail
          for test_file in test/i18n-*.mjs; do
            echo "Running $test_file"
            node "$test_file"
          done

      - name: Existing application smoke
        shell: bash
        run: |
          set -o pipefail
          set +e
          npm test 2>&1 | tee /tmp/splendoria-existing-smoke.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            if grep -Fq 'Vetrina: asset JavaScript non versionato contro la cache del browser' /tmp/splendoria-existing-smoke.log; then
              echo 'Known pre-existing cache-bust assertion detected.'
            elif grep -Fq 'Accessibilità: navigazione da tastiera, focus o riduzione del movimento incompleti' /tmp/splendoria-existing-smoke.log; then
              echo 'Known pre-existing accessibility assertion detected.'
            else
              echo 'Unexpected baseline smoke failure.'
              exit "$status"
            fi
          fi

      - name: Verify Wrangler entry point
        shell: bash
        run: |
          if grep -Fq '"main": "src/german-ghostwriter-style-v2-worker.js"' wrangler.jsonc; then
            grep -Fq 'import ghostwriterWorker from "./german-ghostwriter-worker.js"' src/german-ghostwriter-style-v2-worker.js
            grep -Fq 'ZEITGENÖSSISCHER GHOSTWRITER-STILPASS V2 — DEUTSCH' src/german-ghostwriter-style-v2-worker.js
            echo 'German ghostwriter style v2 entry point active.'
          elif grep -Fq '"main": "src/german-ghostwriter-worker.js"' wrangler.jsonc; then
            echo 'German ghostwriter entry point active.'
          elif grep -Fq '"main": "src/studio-deep-i18n-worker.js"' wrangler.jsonc; then
            echo 'Deep i18n entry point active.'
          else
            grep -Fq '"main": "src/studio-language-worker.js"' wrangler.jsonc
          fi
          npm run check
