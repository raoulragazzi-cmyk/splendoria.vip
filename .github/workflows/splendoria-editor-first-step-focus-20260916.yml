name: Splendoria editor first-step focus

on:
  push:
    branches:
      - ux/editor-first-step-focus-20260916
    paths:
      - ".github/workflows/splendoria-editor-first-step-focus-20260916.yml"

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ux/editor-first-step-focus-20260916
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      - name: Apply guarded editor hierarchy patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          worker_path = Path('src/worker.js')
          worker = worker_path.read_text(encoding='utf-8')
          opening = '<h2>Prima delle parole, ci sono i ricordi.</h2><div class="grid three">'
          replacement_opening = '<h2>Prima delle parole, ci sono i ricordi.</h2><details class="book-settings-options"><summary>Impostazioni del libro</summary><div class="grid three">'
          if worker.count(opening) != 1:
              raise SystemExit(f'editor settings opening guard failed: {worker.count(opening)} matches')
          worker = worker.replace(opening, replacement_opening, 1)
          closing = '<option value="117"${structure.chapters === 18 ? " selected" : ""}>18 capitoli \\xB7 circa 6\\u20137 pagine ciascuno</option></select></label><div class="source-material-panel">'
          replacement_closing = '<option value="117"${structure.chapters === 18 ? " selected" : ""}>18 capitoli \\xB7 circa 6\\u20137 pagine ciascuno</option></select></label><div data-editor-language-slot></div></details><div class="source-material-panel">'
          if worker.count(closing) != 1:
              raise SystemExit(f'editor settings closing guard failed: {worker.count(closing)} matches')
          worker = worker.replace(closing, replacement_closing, 1)
          worker_path.write_text(worker, encoding='utf-8')

          lang_path = Path('src/studio-language-worker.js')
          lang = lang_path.read_text(encoding='utf-8')
          old = '''function injectEditorControls(html, ui, pref) {
            if (html.includes("data-book-language-panel")) return setDictationSelection(html, pref.dictationLanguage);
            let out = html.replace(/<form class="wow-panel"(?![^>]*\\bid=)/, '<form class="wow-panel" id="spl-book-settings"');
            out = out.replace(/(<form class="wow-panel"[^>]*>[\\s\\S]*?<h2[^>]*>[\\s\\S]*?<\\/h2>)/, `$1${languagePanel(ui, pref)}`);
            return setDictationSelection(out, pref.dictationLanguage);
          }'''.replace('            ', '')
          new = '''function injectEditorControls(html, ui, pref) {
            if (html.includes("data-book-language-panel")) return setDictationSelection(html, pref.dictationLanguage);
            let out = html.replace(/<form class="wow-panel"(?![^>]*\\bid=)/, '<form class="wow-panel" id="spl-book-settings"');
            const panel = languagePanel(ui, pref);
            const settingsSlot = '<div data-editor-language-slot></div>';
            if (out.includes(settingsSlot)) out = out.replace(settingsSlot, panel);
            else out = out.replace(/(<form class="wow-panel"[^>]*>[\\s\\S]*?<h2[^>]*>[\\s\\S]*?<\\/h2>)/, `$1${panel}`);
            return setDictationSelection(out, pref.dictationLanguage);
          }'''.replace('            ', '')
          if lang.count(old) != 1:
              raise SystemExit(f'editor language injector guard failed: {lang.count(old)} matches')
          lang_path.write_text(lang.replace(old, new, 1), encoding='utf-8')

          editor_path = Path('src/i18n-editor-worker.js')
          editor = editor_path.read_text(encoding='utf-8')
          de_anchor = "['<h2>Prima delle parole, ci sono i ricordi.</h2>', '<h2>Vor den Worten stehen die Erinnerungen.</h2>'],"
          de_new = de_anchor + "\n    ['<summary>Impostazioni del libro</summary>', '<summary>Bucheinstellungen</summary>'],"
          en_anchor = "['<h2>Prima delle parole, ci sono i ricordi.</h2>', '<h2>Before the words come the memories.</h2>'],"
          en_new = en_anchor + "\n    ['<summary>Impostazioni del libro</summary>', '<summary>Book settings</summary>'],"
          for source, target in [(de_anchor, de_new), (en_anchor, en_new)]:
              if editor.count(source) != 1:
                  raise SystemExit(f'editor i18n guard failed: {source} count={editor.count(source)}')
              editor = editor.replace(source, target, 1)
          editor_path.write_text(editor, encoding='utf-8')

          styles_path = Path('src/styles.js')
          styles = styles_path.read_text(encoding='utf-8')
          anchor = '.wow-panel{background:'
          if styles.count(anchor) != 1 or '.book-settings-options{' in styles:
              raise SystemExit('editor settings styles guard failed')
          css = '.book-settings-options{margin:20px 0 26px;border:1px solid #c9ddd6;border-radius:18px;background:#f8fbf9;padding:15px 18px}.book-settings-options>summary{cursor:pointer;font-weight:850;color:var(--teal-dark)}.book-settings-options[open]>summary{margin-bottom:12px}.book-settings-options [data-book-language-panel]{margin:18px 0 4px}\n'
          styles = styles.replace(anchor, css + anchor, 1)
          styles_path.write_text(styles, encoding='utf-8')

          smoke_path = Path('test/i18n-editor-smoke.mjs')
          smoke = smoke_path.read_text(encoding='utf-8')
          smoke = smoke.replace('"Die Seele des Buches", "Buchstruktur", "Deine Muse"', '"Die Seele des Buches", "Bucheinstellungen", "Buchstruktur", "Deine Muse"')
          smoke = smoke.replace('"The soul of the book", "Book structure", "Your Muse"', '"The soul of the book", "Book settings", "Book structure", "Your Muse"')
          smoke_path.write_text(smoke, encoding='utf-8')
          PY

          cat > test/editor-first-step-smoke.mjs <<'EOF'
          import worker from "../src/studio-language-worker.js";

          const USER = { id: "user-1", email: "anna@example.com", nome: "Anna", passwordHash: "hash", createdAt: "2026-01-01T10:00:00.000Z", emailVerifiedAt: "2026-01-02T10:00:00.000Z" };
          const PROJECT = { id: "book-1", userId: USER.id, title: "La mia storia", genre: "Autobiografia", targetPages: 84, plan: "free", status: "bozza", tone: "Emozionante e autentico", audience: "", sourceMaterial: "", story: "", people: "", events: "", message: "", specialDataConsentAt: null, createdAt: "2026-01-01T10:00:00.000Z", updatedAt: "2026-01-01T10:00:00.000Z" };
          const DB = { prepare(sql = "") { return { bind() { return this; }, async run() { return { success: true, meta: { changes: 1 } }; }, async first() { if (sql === "SELECT 1 AS ok") return { ok: 1 }; if (sql.includes('FROM "Session" s JOIN "User"')) return { ...USER }; if (sql.includes('SELECT p.* FROM "BookProject" p LEFT JOIN "BookProjectAdmin"')) return { ...PROJECT }; if (sql.includes('SELECT * FROM "BookInterview"')) return null; if (sql.includes('SELECT createdAt FROM "BookProjectBackup"')) return null; if (sql.includes('SELECT statoCommerciale FROM "BookProjectAdmin"')) return { statoCommerciale: "gratuito" }; return null; }, async all() { if (sql.includes('FROM "BookChapter"') || sql.includes('FROM "BookChapterSection"') || sql.includes('FROM "Ordine"')) return { results: [] }; return { results: [] }; } }; }, async batch(statements) { return statements.map(() => ({ success: true, meta: { changes: 1 } })); } };
          const env = { DB, APP_URL: "https://www.splendoria.vip", ADMIN_EMAIL: "admin@example.invalid", EMAIL_FROM: "contatti@splendoria.vip", AI: { async run() { return { response: "ok" }; } } };
          const response = await worker.fetch(new Request("https://www.splendoria.vip/libro/book-1", { headers: { cookie: "spl_session=test-session" } }), env);
          if (response.status !== 200) throw new Error(`editor status ${response.status}`);
          const html = await response.text();
          for (const marker of ['<details class="book-settings-options">', '<summary>Impostazioni del libro</summary>', 'name="title"', 'name="tone"', 'name="audience"', 'name="targetPages"', 'data-book-language-panel', 'id="source-material-book-1"']) if (!html.includes(marker)) throw new Error(`editor hierarchy missing ${marker}`);
          if (html.includes('data-editor-language-slot')) throw new Error('editor language slot was not replaced');
          const detailsStart = html.indexOf('<details class="book-settings-options">');
          const detailsEnd = html.indexOf('</details>', detailsStart);
          for (const marker of ['name="title"', 'name="tone"', 'name="audience"', 'name="targetPages"', 'data-book-language-panel']) {
            const index = html.indexOf(marker);
            if (!(index > detailsStart && index < detailsEnd)) throw new Error(`editor setting is not inside progressive disclosure: ${marker}`);
          }
          const sourceIndex = html.indexOf('id="source-material-book-1"');
          if (!(sourceIndex > detailsEnd)) throw new Error('real source material is not the first visible content area after settings');
          console.log('editor first step: book settings collapsed, source material remains primary');
          EOF

      - name: Validate focused and full regressions
        shell: bash
        run: |
          set -euo pipefail
          node --check src/worker.js
          node --check src/studio-language-worker.js
          node --check src/i18n-editor-worker.js
          node --check test/editor-first-step-smoke.mjs
          node test/editor-first-step-smoke.mjs
          node test/i18n-editor-smoke.mjs
          node test/studio-language-smoke.mjs
          node test/studio-deep-i18n-smoke.mjs
          node test/studio-dynamic-residuals-smoke.mjs
          for test_file in test/i18n-*.mjs; do node "$test_file"; done
          set +e
          npm test 2>&1 | tee /tmp/smoke.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            if grep -Fq 'Accessibilità: navigazione da tastiera, focus o riduzione del movimento incompleti' /tmp/smoke.log; then
              echo 'Known baseline accessibility assertion only.'
            else
              exit "$status"
            fi
          fi
          npm run check
          git diff --check

      - name: Commit application changes
        run: |
          git config user.name "splendoria-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/worker.js src/studio-language-worker.js src/i18n-editor-worker.js src/styles.js test/i18n-editor-smoke.mjs test/editor-first-step-smoke.mjs
          git commit -m "ux: focus first editor step on real story material"
          git push origin HEAD:ux/editor-first-step-focus-20260916

      - name: Remove one-shot workflow
        run: |
          git rm .github/workflows/splendoria-editor-first-step-focus-20260916.yml
          git commit -m "chore: remove completed editor focus workflow"
          git push origin HEAD:ux/editor-first-step-focus-20260916
