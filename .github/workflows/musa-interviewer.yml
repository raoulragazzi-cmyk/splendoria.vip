name: Musa interviewer validation
on:
  pull_request:
    paths:
      - 'src/musa-interview-policy.js'
      - 'src/musa-interview-store.js'
      - 'src/musa-interview-consent.js'
      - 'src/musa-interview-next.js'
      - 'migrations/0007_musa_ai_consent.sql'
      - 'test/musa-interview-next.mjs'
      - 'test/musa-interview-consent.mjs'
      - 'src/musa-interview-auth.js'
      - 'src/musa-interview-api.js'
      - 'test/musa-interview-api.mjs'
      - 'test/musa-interview-auth.mjs'
      - 'migrations/0006_musa_interview.sql'
      - 'test/musa-interview-store.mjs'
      - 'test/musa-interview-prototype.mjs'
      - 'src/musa-interview-prototype.js'
      - 'src/german-editorial-room-worker.js'
      - 'test/musa-interview-policy.mjs'
      - '.github/workflows/musa-interviewer.yml'
  workflow_dispatch:
jobs:
  musa-policy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate server consent and revocation
        run: node test/musa-interview-consent.mjs
      - name: Validate persisted-context and consent gate
        run: node test/musa-interview-next.mjs
      - name: Validate AI question generator
        run: node test/musa-interview-ai.mjs
      - name: Validate interview policy
        run: node test/musa-interview-policy.mjs
      - name: Validate API safety boundary
        run: node test/musa-interview-api.mjs
      - name: Validate authentication boundary
        run: node test/musa-interview-auth.mjs
      - name: Validate persistence checks
        run: node test/musa-interview-store.mjs
      - name: Validate prototype HTML and escaping
        run: node test/musa-interview-prototype.mjs
