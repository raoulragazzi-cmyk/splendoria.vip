name: TEMP tone production release 2026-09-18

on:
  push:
    branches: ["splendoria.vip"]
    paths:
      - ".github/workflows/temp-tone-production-20260918.yml"

permissions:
  contents: read

concurrency:
  group: splendoria-production-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      APPROVED_APP_SHA: 60cbc71a5017974d586da4bdd3bc5d2ae099982c
      EXPECTED_PROD_DB_ID: 1a46b8b0-2e6f-44cf-a22f-4950259f9434
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Freeze exact candidate
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$APPROVED_APP_SHA"...HEAD)"
          test "$changed" = ".github/workflows/temp-tone-production-20260918.yml" || {
            echo "Unexpected changes after approved candidate:"
            printf '%s\n' "$changed"
            exit 1
          }
          grep -Fq '"name": "splendoria-v2"' wrangler.jsonc
          grep -Fq '"main": "src/german-editorial-room-worker.js"' wrangler.jsonc
          grep -Fq '"database_name": "splendoria-db"' wrangler.jsonc
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"

      - run: npm ci

      - name: Validate tone release candidate
        shell: bash
        run: |
          set -euo pipefail
          node test/i18n-editor-smoke.mjs
          node test/i18n-visible-residuals-smoke.mjs
          npm audit --audit-level=high
          npx wrangler deploy --dry-run --env=""

      - name: Verify current production D1 binding
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS             -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"             "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/splendoria-v2/settings"             -o /tmp/settings-before.json
          jq -e '.success == true' /tmp/settings-before.json >/dev/null
          db_id="$(jq -r '.result.bindings[] | select(.name=="DB" and .type=="d1") | (.id // .namespace_id // empty)' /tmp/settings-before.json | head -n1)"
          test "$db_id" = "$EXPECTED_PROD_DB_ID"

      - name: Deploy production Worker
        shell: bash
        run: |
          set +e
          npx wrangler deploy --env="" 2>&1 | tee /tmp/deploy.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            grep -Fq 'Uploaded splendoria-v2' /tmp/deploy.log
            grep -Fq 'Deployed splendoria-v2 triggers' /tmp/deploy.log
            echo "Wrangler returned non-zero only after Worker publication; continuing to read-back."
          fi

      - name: Production read-back
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS https://www.splendoria.vip/healthz -o /tmp/health
          grep -Fq '"status":"ok"' /tmp/health

          curl -fsS             -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"             "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/splendoria-v2/settings"             -o /tmp/settings-after.json
          jq -e '.success == true' /tmp/settings-after.json >/dev/null
          db_id="$(jq -r '.result.bindings[] | select(.name=="DB" and .type=="d1") | (.id // .namespace_id // empty)' /tmp/settings-after.json | head -n1)"
          test "$db_id" = "$EXPECTED_PROD_DB_ID"
          echo "Production tone candidate published, healthy and still bound to production D1."
