name: Splendoria online save and source UI

on:
  push:
    branches: ["splendoria.vip"]
    paths: [".github/workflows/save-online-source-ui-20260901.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: splendoria.vip
          fetch-depth: 0
      - run: python .github/scripts/save_online_source_ui_20260901.py
      - run: npm ci
      - run: |
          node --check src/worker.js
          node --check src/studio-worker.js
          npm run check
      - name: Commit application source
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/worker.js src/studio-worker.js
          git diff --cached --check
          git commit -m "fix: harden online saves and widen source material"
          git push origin HEAD:splendoria.vip
