name: Musa staging verification launcher

on:
  workflow_dispatch:
    inputs:
      apply_migrations:
        description: "Apply pending migrations to isolated D1 staging after review"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: splendoria-musa-d1-staging
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/musa-intervista-adattiva-20261012
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Verify staging binding (never production)
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const config=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          const staging=config.env?.staging;
          const d1=staging?.d1_databases?.find(x=>x.binding==='DB');
          if(staging?.name!=='splendoria-v2-staging' || d1?.database_name!=='splendoria-v2-test' || d1?.database_id!=='8bf872f6-3f9e-471f-95bc-a99a94f0d97c') throw Error('Refusing non-staging target');
          NODE
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          # Never print or copy the secret to logs. Reject common paste errors.
          if [[ "$CLOUDFLARE_API_TOKEN" == Bearer\ * ]] ||
             [[ "$CLOUDFLARE_API_TOKEN" == *      - name: Run Musa regression suite
        run: |
          set -euo pipefail
          for f in test/musa-interview-*.mjs; do node "$f"; done
          python3 test/musa-sqlite-integration.py
          python3 test/musa-quota-sqlite.py
          npm run check:staging
      - name: Check Cloudflare D1 credential scope
        shell: bash
        run: |
          set -euo pipefail
          echo "Validating account token for isolated Splendoria staging database."
          if ! npx wrangler d1 execute DB --env staging --remote --command "SELECT 1 AS authorized"; then
            echo "::error::Cloudflare D1 access failed. Check GitHub Environment staging secrets CLOUDFLARE_STAGING_API_TOKEN and CLOUDFLARE_ACCOUNT_ID. The token must have Account D1 Edit for the account containing splendoria-v2-test. No migration was attempted."
            exit 1
          fi
      - name: List pending staging migrations
        run: npx wrangler d1 migrations list DB --env staging --remote
      - name: Only when explicitly selected apply staging migrations
        if: ${{ inputs.apply_migrations }}
        run: npx wrangler d1 migrations apply DB --env staging --remote
      - name: Verify post-migration D1 schema
        if: ${{ inputs.apply_migrations }}
        run: |
          npx wrangler d1 execute DB --env staging --remote --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('MuseInterviewSession','MuseInterviewTurn','MuseInterviewConsent','MuseRequestQuota') ORDER BY name"
      - name: No application deployment
        run: echo "No Worker or production deployment was requested."
