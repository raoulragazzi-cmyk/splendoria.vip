name: Musa D1 staging credentials diagnostic
on:
  push:
    branches: [splendoria.vip]
    paths: [.github/workflows/musa-d1-credentials-diagnostic.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-staging-d1-credentials:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 5
    env:
      ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STAGING_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_API_TOKEN }}
      GENERAL_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check account selection and staging D1 read permissions
        shell: bash
        run: |
          set -euo pipefail
          expected_account="9ea664e4c34f649045f64024e0db52e1"
          database_id="8bf872f6-3f9e-471f-95bc-a99a94f0d97c"
          if [[ -z "${ACCOUNT_ID:-}" ]]; then
            echo "::error::staging CLOUDFLARE_ACCOUNT_ID is missing"
            exit 1
          fi
          if [[ "$ACCOUNT_ID" != "$expected_account" ]]; then
            echo "::error::staging CLOUDFLARE_ACCOUNT_ID does not match the verified Splendoria account"
            exit 1
          fi
          echo "Staging account identity matches the verified Cloudflare account."
          probe() {
            local label="$1" token="$2" response status code
            if [[ -z "$token" ]]; then
              echo "$label token missing"; return 0
            fi
            response="$(mktemp)"
            status="$(curl --silent --show-error --max-time 25 --output "$response" --write-out '%{http_code}' \
              --request POST "https://api.cloudflare.com/client/v4/accounts/$expected_account/d1/database/$database_id/query" \
              --header "Authorization: Bearer $token" \
              --header 'Content-Type: application/json' \
              --data '{"sql":"SELECT 1 AS ok"}')"
            code="$(jq -r '.errors[0].code // "none"' "$response")"
            echo "$label staging D1 read-only probe: HTTP=$status Cloudflare_code=$code"
            rm -f "$response"
          }
          probe "Dedicated" "${STAGING_TOKEN:-}"
          probe "General" "${GENERAL_TOKEN:-}"
          echo "Diagnostic complete. No database writes or deployment."
