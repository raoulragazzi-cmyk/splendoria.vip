name: Splendoria DE staging one-shot

on:
  push:
    branches: ["ux/de-dictation-safety-audit-20260917"]
    paths: [".github/workflows/de-staging-one-shot-20260917.yml"]

permissions:
  contents: read

concurrency:
  group: splendoria-de-staging-one-shot
  cancel-in-progress: false

jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STAGING_BASE_URL: https://splendoria-v2-staging.raoulragazzi.workers.dev
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify isolated staging target
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '"name": "splendoria-v2-staging"' wrangler.jsonc
          grep -Fq '"database_name": "splendoria-v2-test"' wrangler.jsonc
          test "$STAGING_BASE_URL" = "https://splendoria-v2-staging.raoulragazzi.workers.dev"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate candidate
        shell: bash
        run: |
          set -euo pipefail
          npm run check:staging
          for test_file in test/i18n-*.mjs; do
            [ -e "$test_file" ] || continue
            node "$test_file"
          done
          node test/studio-dictation-de-ux.test.mjs
          node test/de-release-runtime.test.mjs
      - name: Require staging-only credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "Missing CLOUDFLARE_STAGING_API_TOKEN"; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
      - name: Deploy isolated staging only
        run: npx wrangler deploy --env staging
      - name: HTTP acceptance
        shell: bash
        run: |
          set -euo pipefail
          base="${STAGING_BASE_URL%/}"
          for path in /healthz / /de/ /en/ /de/guida /en/guida /de/area-clienti /en/area-clienti; do
            code="$(curl -sS -o /tmp/body -w '%{http_code}' "$base$path")"
            case "$code" in
              200|204|301|302|303|307|308) ;;
              *) echo "Unexpected HTTP $code for $path"; head -c 1200 /tmp/body || true; exit 1;;
            esac
          done
          echo "DE staging acceptance passed."
