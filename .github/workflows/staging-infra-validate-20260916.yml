name: Staging infrastructure validation

on:
  push:
    branches:
      - infra/staging-hardening-20260916
    paths:
      - "wrangler.jsonc"
      - "package.json"
      - "test/staging-config-smoke.mjs"
      - ".github/workflows/staging-infra-validate-20260916.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: infra/staging-hardening-20260916
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Staging config contract
        run: node test/staging-config-smoke.mjs
      - name: Wrangler staging dry run
        run: npm run check:staging
      - name: Existing candidate regressions
        shell: bash
        run: |
          set -euo pipefail
          node test/progressive-book-setup-smoke.mjs
          node test/client-first-access-smoke.mjs
          node test/single-muse-cta-smoke.mjs
          node test/studio-cache-policy-smoke.mjs
          for test_file in test/i18n-*.mjs; do node "$test_file"; done
          git diff --check integration/onboarding-zero-friction-20260916...HEAD
      - name: Remove one-shot validator
        run: |
          git config user.name "splendoria-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/staging-infra-validate-20260916.yml
          git commit -m "chore: remove completed staging infra validator"
          git push origin HEAD:infra/staging-hardening-20260916
