name: Splendoria Studio JS Cache Policy 20260916

on:
  push:
    branches:
      - fix/studio-js-cache-policy-20260916
    paths:
      - ".github/workflows/splendoria-studio-cache-policy-20260916.yml"

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: fix/studio-js-cache-policy-20260916
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      - name: Apply guarded cache policy fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          studio_path = Path("src/studio-worker.js")
          worker_path = Path("src/worker.js")
          smoke_path = Path("test/smoke.mjs")
          test_path = Path("test/studio-cache-policy-smoke.mjs")
          workflow_path = Path(".github/workflows/splendoria-studio-cache-policy-20260916.yml")

          studio = studio_path.read_text(encoding="utf-8")
          worker = worker_path.read_text(encoding="utf-8")
          smoke = smoke_path.read_text(encoding="utf-8")

          marker = "  if (url.pathname === '/assets/studio.js' && contentType.includes('javascript')) {"
          next_marker = "\n\n  if (/^\\/libro\\/[^/]+(?:\\/.*)?$/.test(url.pathname)"
          start = studio.find(marker)
          end = studio.find(next_marker, start)
          if start < 0 or end <= start:
              raise SystemExit(f"Studio JS block boundaries not found: start={start} end={end}")
          block = studio[start:end]

          old_browser_cache = "headers.set('cache-control', 'public, max-age=31536000, immutable');"
          old_cdn_cache = "headers.set('cdn-cache-control', 'public, max-age=31536000, immutable');"
          if block.count(old_browser_cache) != 1 or block.count(old_cdn_cache) != 1:
              raise SystemExit(
                  f"Studio JS block cache sentinel mismatch: browser={block.count(old_browser_cache)} cdn={block.count(old_cdn_cache)}"
              )
          if block.count("return new Response(patchStudioScript(source)") != 1:
              raise SystemExit("Studio JS response sentinel mismatch")

          new_browser_cache = """// studio.js is transformed by this Worker. The transformed representation can
              // change while the underlying static asset stays byte-identical, so static
              // validators and a year-long immutable policy are unsafe here.
              headers.set('cache-control', 'no-store, max-age=0');"""
          new_validator_policy = """headers.delete('cdn-cache-control');
              headers.delete('etag');
              headers.delete('last-modified');"""
          patched_block = block.replace(old_browser_cache, new_browser_cache, 1)
          patched_block = patched_block.replace(old_cdn_cache, new_validator_policy, 1)
          if old_browser_cache in patched_block or old_cdn_cache in patched_block:
              raise SystemExit("Studio JS transformed block still contains long-lived cache directives")
          studio = studio[:start] + patched_block + studio[end:]

          old_version = '/assets/studio.js?v=20260812-3'
          new_version = '/assets/studio.js?v=20260916-1'
          if worker.count(old_version) != 1:
              raise SystemExit(f"worker.js cache version sentinel mismatch: expected 1, got {worker.count(old_version)}")
          worker = worker.replace(old_version, new_version, 1)
          if smoke.count(old_version) != 1:
              raise SystemExit(f"smoke.mjs cache version sentinel mismatch: expected 1, got {smoke.count(old_version)}")
          smoke = smoke.replace(old_version, new_version, 1)

          test_path.write_text('''import studioWorker from "../src/studio-worker.js";\nimport { readFileSync } from "node:fs";\n\nconst workerSource = readFileSync(new URL("../src/worker.js", import.meta.url), "utf8");\nconst studioSource = readFileSync(new URL("../src/studio-worker.js", import.meta.url), "utf8");\n\nif (!workerSource.includes('/assets/studio.js?v=20260916-1')) {\n  throw new Error("Studio JS: cache-busting HTML version not updated");\n}\nconst marker = "  if (url.pathname === '/assets/studio.js' && contentType.includes('javascript')) {";\nconst nextMarker = "\\n\\n  if (/^\\\\/libro\\\\/[^/]+(?:\\\\/.*)?$/.test(url.pathname)";\nconst start = studioSource.indexOf(marker);\nconst end = studioSource.indexOf(nextMarker, start);\nif (start < 0 || end <= start) throw new Error("Studio JS: transformed asset block not found");\nconst block = studioSource.slice(start, end);\nif (!block.includes("headers.set('cache-control', 'no-store, max-age=0')")) throw new Error("Studio JS: transformed asset is not no-store");\nif (block.includes("headers.set('cache-control', 'public, max-age=31536000, immutable')") || block.includes("headers.set('cdn-cache-control', 'public, max-age=31536000, immutable')")) throw new Error("Studio JS: long-lived cache directive still active");\nfor (const header of ["cdn-cache-control", "etag", "last-modified"]) {\n  if (!block.includes(`headers.delete('${header}')`)) throw new Error(`Studio JS: ${header} validator/cache header not removed`);\n}\n\nconst response = await studioWorker.fetch(new Request("https://www.splendoria.vip/assets/studio.js?v=20260916-1"), {\n  DB: { prepare() { throw new Error("Studio JS asset must not query D1"); } }\n});\nif (response.status !== 200) throw new Error(`Studio JS: unexpected status ${response.status}`);\nif (response.headers.get("cache-control") !== "no-store, max-age=0") throw new Error("Studio JS: runtime cache-control is not no-store");\nif (response.headers.has("cdn-cache-control")) throw new Error("Studio JS: CDN cache-control leaked from base asset");\nif (response.headers.has("etag") || response.headers.has("last-modified")) throw new Error("Studio JS: static validators leaked onto transformed representation");\nconst body = await response.text();\nif (!body.includes("splendoria:client-draft:v1:")) throw new Error("Studio JS: runtime patch was not applied");\nconsole.log("studio cache policy: transformed JS cannot remain stale across Worker patch changes");\n''', encoding="utf-8")

          studio_path.write_text(studio, encoding="utf-8")
          worker_path.write_text(worker, encoding="utf-8")
          smoke_path.write_text(smoke, encoding="utf-8")
          workflow_path.unlink()
          PY

      - name: Validate focused contract
        run: |
          npm ci
          node --check src/studio-worker.js
          node --check src/worker.js
          node --check test/studio-cache-policy-smoke.mjs
          node test/studio-cache-policy-smoke.mjs
          npm test
          npm run check
          git diff --check

      - name: Commit verified product changes
        shell: bash
        run: |
          git config user.name "splendoria-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix: prevent stale transformed Studio JavaScript"
          git push origin HEAD:fix/studio-js-cache-policy-20260916
