name: Splendoria Studio JS Cache Policy 20260916

on:
  push:
    branches:
      - fix/studio-js-cache-policy-20260916
    paths:
      - ".github/workflows/splendoria-studio-cache-policy-20260916.yml"

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/studio-js-cache-policy-20260916
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Apply guarded cache policy fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          studio_path = Path("src/studio-worker.js")
          worker_path = Path("src/worker.js")
          smoke_path = Path("test/smoke.mjs")
          test_path = Path("test/studio-cache-policy-smoke.mjs")
          workflow_path = Path(".github/workflows/splendoria-studio-cache-policy-20260916.yml")

          studio = studio_path.read_text(encoding="utf-8")
          worker = worker_path.read_text(encoding="utf-8")
          smoke = smoke_path.read_text(encoding="utf-8")

          old_cache = '''  if (url.pathname === '/assets/studio.js' && contentType.includes('javascript')) {
            const source = await response.text();
            const headers = new Headers(response.headers);
            headers.delete('content-length');
            headers.set('cache-control', 'public, max-age=31536000, immutable');
            headers.set('cdn-cache-control', 'public, max-age=31536000, immutable');
            return new Response(patchStudioScript(source), { status: response.status, statusText: response.statusText, headers });
          }'''

          new_cache = '''  if (url.pathname === '/assets/studio.js' && contentType.includes('javascript')) {
            const source = await response.text();
            const headers = new Headers(response.headers);
            headers.delete('content-length');
            // studio.js is transformed by this Worker. Its representation therefore changes
            // when the Worker patch changes even if the underlying static asset does not.
            // Do not reuse the static asset validators or a year-long immutable cache here.
            headers.set('cache-control', 'no-store, max-age=0');
            headers.delete('cdn-cache-control');
            headers.delete('etag');
            headers.delete('last-modified');
            return new Response(patchStudioScript(source), { status: response.status, statusText: response.statusText, headers });
          }'''

          if studio.count(old_cache) != 1:
              raise SystemExit(f"Studio cache sentinel mismatch: expected 1 block, got {studio.count(old_cache)}")
          studio = studio.replace(old_cache, new_cache, 1)

          old_version = '/assets/studio.js?v=20260812-3'
          new_version = '/assets/studio.js?v=20260916-1'
          if worker.count(old_version) != 1:
              raise SystemExit(f"worker.js cache version sentinel mismatch: expected 1, got {worker.count(old_version)}")
          worker = worker.replace(old_version, new_version, 1)

          if smoke.count(old_version) != 1:
              raise SystemExit(f"smoke.mjs cache version sentinel mismatch: expected 1, got {smoke.count(old_version)}")
          smoke = smoke.replace(old_version, new_version, 1)

          test_path.write_text('''import studioWorker from "../src/studio-worker.js";\nimport { readFileSync } from "node:fs";\n\nconst workerSource = readFileSync(new URL("../src/worker.js", import.meta.url), "utf8");\nconst studioSource = readFileSync(new URL("../src/studio-worker.js", import.meta.url), "utf8");\n\nif (!workerSource.includes('/assets/studio.js?v=20260916-1')) {\n  throw new Error("Studio JS: cache-busting HTML version not updated");\n}\n\nconst block = studioSource.match(/if \\(url\\.pathname === '\\/assets\\/studio\\.js'[\\s\\S]*?return new Response\\(patchStudioScript\\(source\\)[\\s\\S]*?\\n  \\}/)?.[0] || "";\nif (!block) throw new Error("Studio JS: transformed asset block not found");\nif (!block.includes("'no-store, max-age=0'")) throw new Error("Studio JS: transformed asset is not no-store");\nif (block.includes("immutable")) throw new Error("Studio JS: immutable cache must not be used for transformed JS");\nfor (const header of ["cdn-cache-control", "etag", "last-modified"]) {\n  if (!block.includes(`headers.delete('${header}')`)) throw new Error(`Studio JS: ${header} validator/cache header not removed`);\n}\n\nconst response = await studioWorker.fetch(new Request("https://www.splendoria.vip/assets/studio.js?v=20260916-1"), {\n  DB: { prepare() { throw new Error("Studio JS asset must not query D1"); } }\n});\nif (response.status !== 200) throw new Error(`Studio JS: unexpected status ${response.status}`);\nif (response.headers.get("cache-control") !== "no-store, max-age=0") throw new Error("Studio JS: runtime cache-control is not no-store");\nif (response.headers.has("cdn-cache-control")) throw new Error("Studio JS: CDN cache-control leaked from base asset");\nif (response.headers.has("etag") || response.headers.has("last-modified")) throw new Error("Studio JS: static validators leaked onto transformed representation");\nconst body = await response.text();\nif (!body.includes("splendoria:client-draft:v1:")) throw new Error("Studio JS: runtime patch was not applied");\n\nconsole.log("studio cache policy: transformed JS cannot remain stale across Worker patch changes");\n''', encoding="utf-8")

          studio_path.write_text(studio, encoding="utf-8")
          worker_path.write_text(worker, encoding="utf-8")
          smoke_path.write_text(smoke, encoding="utf-8")

          # This workflow is intentionally one-shot. Remove it from the resulting branch
          # so the PR contains only the product/test changes and no maintenance debris.
          workflow_path.unlink()
          PY

      - name: Validate focused contract
        run: |
          npm ci
          node --check src/studio-worker.js
          node --check src/worker.js
          node --check test/studio-cache-policy-smoke.mjs
          node test/studio-cache-policy-smoke.mjs
          npm test
          npm run check
          git diff --check

      - name: Commit verified product changes
        shell: bash
        run: |
          git config user.name "splendoria-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix: prevent stale transformed Studio JavaScript"
          git push origin HEAD:fix/studio-js-cache-policy-20260916
