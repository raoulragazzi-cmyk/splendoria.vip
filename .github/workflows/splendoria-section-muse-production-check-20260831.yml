name: Splendoria per-section Musa production check 2026-08-31

on:
  push:
    branches:
      - splendoria.vip
    paths:
      - .github/workflows/splendoria-section-muse-production-check-20260831.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait for production and verify public release
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 24); do
            echo "Production check attempt $i"
            home=$(curl --silent --show-error --max-time 20 https://www.splendoria.vip/ || true)
            asset=$(curl --silent --show-error --max-time 20 'https://www.splendoria.vip/assets/studio.js?v=20260831-1' || true)
            health=$(curl --silent --show-error --max-time 20 https://www.splendoria.vip/healthz || true)
            if printf '%s' "$home" | grep -q 'studio.js?v=20260831-1' \
              && printf '%s' "$asset" | grep -q 'Affidati alla Musa per questa sezione' \
              && printf '%s' "$health" | grep -q '"status":"ok"'; then
              echo "PRODUCTION_SECTION_MUSE_OK"
              printf '%s\n' "$health"
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" = "1"
