name: Validate Splendoria public i18n phase 1

on:
  push:
    branches: ["i18n/public-de-en-phase1"]
    paths:
      - "src/i18n-worker.js"
      - "src/i18n-guard-worker.js"
      - "src/i18n-public-worker.js"
      - "src/i18n-release-worker.js"
      - "src/i18n-legal-worker.js"
      - "src/i18n-privacy-center-worker.js"
      - "src/i18n-entry-worker.js"
      - "src/i18n-auth-worker.js"
      - "src/i18n-client-worker.js"
      - "test/i18n-smoke.mjs"
      - "test/i18n-public-smoke.mjs"
      - "test/i18n-legal-smoke.mjs"
      - "test/i18n-entry-smoke.mjs"
      - "test/i18n-seo-smoke.mjs"
      - "test/i18n-auth-smoke.mjs"
      - "test/i18n-client-smoke.mjs"
      - "wrangler.jsonc"
      - ".github/workflows/i18n-phase1-check.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout i18n branch
        uses: actions/checkout@v5
        with:
          ref: i18n/public-de-en-phase1
          fetch-depth: 0

      - name: Fetch production baseline
        run: git fetch --no-tags origin splendoria.vip:refs/remotes/origin/splendoria.vip

      - name: Install dependencies
        run: npm ci

      - name: Syntax checks
        run: |
          node --check src/worker.js
          node --check src/studio-worker.js
          node --check src/i18n-worker.js
          node --check src/i18n-guard-worker.js
          node --check src/i18n-public-worker.js
          node --check src/i18n-release-worker.js
          node --check src/i18n-legal-worker.js
          node --check src/i18n-privacy-center-worker.js
          node --check src/i18n-entry-worker.js
          node --check src/i18n-auth-worker.js
          node --check src/i18n-client-worker.js
          node --check test/i18n-smoke.mjs
          node --check test/i18n-public-smoke.mjs
          node --check test/i18n-legal-smoke.mjs
          node --check test/i18n-entry-smoke.mjs
          node --check test/i18n-seo-smoke.mjs
          node --check test/i18n-auth-smoke.mjs
          node --check test/i18n-client-smoke.mjs

      - name: Guard Italian application source
        run: git diff --exit-code origin/splendoria.vip...HEAD -- src/worker.js src/studio-worker.js

      - name: Validate locale architecture
        run: |
          grep -Fq '"/de/"' src/i18n-worker.js
          grep -Fq '"/en/"' src/i18n-worker.js
          grep -Fq 'hreflang="x-default"' src/i18n-worker.js
          grep -Fq 'repairSemanticFormValues' src/i18n-guard-worker.js
          grep -Fq 'PUBLIC_GUIDE' src/i18n-public-worker.js
          grep -Fq 'LEGAL_PATHS' src/i18n-legal-worker.js
          grep -Fq 'PRIVACY_CENTER_PATHS' src/i18n-privacy-center-worker.js
          grep -Fq 'LOCALIZED_PUBLIC' src/i18n-entry-worker.js
          grep -Fq 'localizeSitemap' src/i18n-entry-worker.js
          grep -Fq 'CUSTOMER_AUTH_PATHS' src/i18n-auth-worker.js
          grep -Fq 'CLIENT_PATHS' src/i18n-client-worker.js
          grep -Fq 'preserveGenreValues' src/i18n-client-worker.js
          grep -Fq '"main": "src/i18n-client-worker.js"' wrangler.jsonc
          ! grep -Fq '"/admin"' src/i18n-client-worker.js
          ! grep -Fq '"/area-amministratore"' src/i18n-client-worker.js

      - name: Localized showcase smoke suite
        run: node test/i18n-smoke.mjs

      - name: Public home and guide deep-pass
        run: node test/i18n-public-smoke.mjs

      - name: Legal and AI transparency deep-pass
        run: node test/i18n-legal-smoke.mjs

      - name: Public composition entry smoke
        run: node test/i18n-entry-smoke.mjs

      - name: Sitemap robots and HEAD deep-pass
        run: node test/i18n-seo-smoke.mjs

      - name: Customer authentication deep-pass
        run: node test/i18n-auth-smoke.mjs

      - name: Account and Studio shell deep-pass
        run: node test/i18n-client-smoke.mjs

      - name: Existing smoke suite with guarded baseline
        shell: bash
        run: |
          set -o pipefail
          set +e
          npm test 2>&1 | tee /tmp/splendoria-existing-smoke.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            if grep -Fq 'Vetrina: asset JavaScript non versionato contro la cache del browser' /tmp/splendoria-existing-smoke.log; then
              echo 'Known pre-existing cache-bust assertion detected; i18n changes do not modify the Italian application source.'
            elif grep -Fq 'Accessibilità: navigazione da tastiera, focus o riduzione del movimento incompleti' /tmp/splendoria-existing-smoke.log; then
              echo 'Known pre-existing accessibility assertion detected; i18n changes do not modify the Italian application source.'
            else
              echo 'Unexpected baseline smoke failure.'
              exit "$status"
            fi
          fi

      - name: Wrangler dry run
        run: npm run check
